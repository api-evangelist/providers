<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>

  {% include ai-banner.html %}

  {% include topnav.html %}

  <!-- Laneworks ad network (ads.laneworks.net) -->
  <script async src="https://ads.laneworks.net/embed.js"></script>
  <div data-laneworks-ad="top-banner"></div>


  <!-- Main layout -->
  <div class="container-fluid">
    <div class="row">

      <!-- Sidebar -->
      <div class="col-lg-3 col-xl-2 sidebar-col d-none d-lg-block py-4 ps-4 pe-2">
        {% include sidenav-lg.html %}
      </div>

      <!-- Content -->
      <main class="col-lg-9 col-xl-10 py-4 px-3 px-lg-5">

        {% include tag-selector.html %}

        {{ content }}
        <div data-laneworks-ad="content-bottom"></div>

      </main>

    </div>
  </div>

  {% include footer.html %}

  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

  <!-- Kin Score glyph — renders every [data-kin-glyph] placeholder.
       Canonical source: api-evangelist/kin-score/glyph/ -->
  <script src="/assets/js/kin-glyph.js"></script>

</body>

</html>
