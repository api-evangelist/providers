<!-- White-paper promo band. Renders when a page sets `paper:` (one) or `papers:` (several).

     paper:                                   papers:
       slug: state-of-market-data-apis          - slug: state-of-telecom-apis
       title: "The State of Market Data APIs"     title: "The State of Telecom APIs"
       blurb: "One-line hook."                    blurb: "..."
       price: "500"                               price: "500"
                                                - slug: the-camara-standard
     Optional per paper:                          title: "The CAMARA Standard"
       kind: "API Evangelist Standard Report"     blurb: "..."
       gets: "PDF + Word, instant download"       price: "500"
                                                  kind: "API Evangelist Standard Report"
-->
{% if page.paper or page.papers %}
<style>
.paper-promo {
  display: flex; gap: 1.1rem; align-items: center;
  border: 1px solid #e3e7ee; border-left: 4px solid #3d8b37; border-radius: 12px;
  background: #fbfcfe; padding: 1rem 1.15rem; margin: 0.25rem 0 1.4rem;
}
.paper-promo-cover {
  flex: 0 0 auto; width: 96px; height: 124px; border-radius: 6px;
  border: 1px solid #e5e7eb; overflow: hidden; background: #fff;
}
.paper-promo-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.paper-promo-body { flex: 1 1 auto; min-width: 0; }
.paper-promo-eyebrow { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; color: #3d8b37; }
.paper-promo-title { font-size: 1.12rem; font-weight: 700; color: #1a1a2e; margin: 0.15rem 0 0.3rem; line-height: 1.2; }
.paper-promo-blurb { font-size: 0.88rem; color: #5a6472; margin-bottom: 0.6rem; }
.paper-promo-cta { display: inline-flex; align-items: center; gap: 0.4rem; }
.paper-promo-price { font-weight: 700; color: #3d8b37; font-variant-numeric: tabular-nums; }
@media (max-width: 540px) { .paper-promo { flex-direction: column; align-items: flex-start; } }
</style>
{% if page.papers %}
  {% for item in page.papers %}{% include paper-promo-card.html p=item %}{% endfor %}
{% else %}
  {% include paper-promo-card.html p=page.paper %}
{% endif %}
{% endif %}
