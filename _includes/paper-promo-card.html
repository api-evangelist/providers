<!-- One promo card. Rendered by paper-promo.html, which passes the paper object as `p`.
     Do not put a literal include tag in a comment here - Jekyll parses Liquid inside
     HTML comments and will try to execute it.
     Fields on p: slug, title, blurb, price, kind (eyebrow), gets (what-you-get line). -->
<a class="paper-promo" href="{{ include.p.url }}" style="text-decoration:none;">
  <div class="paper-promo-cover">
    <img src="{{ include.p.cover }}" alt="{{ include.p.title }} cover" loading="lazy">
  </div>
  <div class="paper-promo-body">
    <div class="paper-promo-eyebrow">{{ include.p.kind | default: "API Evangelist Sector Report" }}</div>
    <div class="paper-promo-title">{{ include.p.title }}</div>
    <div class="paper-promo-blurb">{{ include.p.blurb }}</div>
    <span class="paper-promo-cta">
      <span class="btn btn-success btn-sm">Read the report &rarr;</span>
      <span class="paper-promo-price ms-1">${{ include.p.price | default: "500" }}</span>
      <span class="text-muted small">· {{ include.p.gets | default: "PDF + Word + AI data bundle, instant download" }}</span>
    </span>
  </div>
</a>
