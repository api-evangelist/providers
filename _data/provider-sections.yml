- id: areas
  title: Areas
  intro: The catalog cut by what an API does rather than who it sells to — the API Evangelist areas, each read as a market and ranked by Kin Score.
  columns: col-md-6
  cards:
  - name: API Management
    icon: settings_input_component
    unit: providers
    count:
      from: total
      key: providers-management
    description: One product in 2012, six markets now — the full-stack platforms, the gateway, ingress and service mesh data plane, developer portals and SDKs, metering and billing, API analytics and observability,
      and the API security vendors who left management entirely, ranked by Kin Score.
    href: /management/
    cta: Browse API Management
  - name: Authentication & Identity
    icon: key
    unit: providers
    count:
      from: total
      key: providers-authentication
    description: Enterprise IAM and workforce identity, the cloud platform identity services, the developer-first CIAM providers, the open source identity servers, and the authorization and policy engines
      — the strongest-publishing area in the catalog, where 97.5% ship a machine-readable contract, ranked by Kin Score.
    href: /authentication/
    cta: Browse Authentication
  - name: API Documentation
    icon: menu_book
    unit: providers
    count:
      from: total
      key: providers-documentation
    description: The market whose entire job is making APIs legible, measured on whether its own products are — the hosted platforms you buy, the reference renderers you embed, and the docs-as-code static
      site generators you build with, ranked by Kin Score.
    href: /documentation/
    cta: Browse Documentation
  - name: API Testing
    icon: science
    unit: providers
    count:
      from: total
      key: providers-testing
    description: The commercial testing and quality platforms, the mocking and service-virtualization layer, load and performance testing, contract testing and test frameworks, the security scanners, and
      the browser and end-to-end frameworks — the first market in the series actually building for agents, ranked by Kin Score.
    href: /testing/
    cta: Browse API Testing
  - name: API Clients
    icon: terminal
    unit: providers
    count:
      from: total
      key: providers-api-clients
    description: The client platforms that operate a hosted service, the local-first and offline-first clients that deliberately ship no cloud at all, and the command-line clients and HTTP libraries the
      whole industry runs on. Only three publish an API of their own — a market deliberately building without a service surface, read as a movement rather than a ranking.
    href: /api-clients/
    cta: Browse API Clients
