# Card grid on the providers home page — rendered by _includes/home.html.
#
# This file is the single place the home page gets its shape from. Adding a new
# country to an existing sector is one entry under that sector's `markets`;
# adding a whole new sector or collection is one new card. Neither needs an
# HTML change.
#
# Each group renders as a labeled row of cards.
#   id       : anchor slug for the row
#   title    : row heading
#   intro    : optional one-line description under the heading
#   columns  : Bootstrap column classes for every card in the row
#   compact  : true renders the smaller band-style card (h6, no body padding)
#
# A card is either a LINK card (href + cta) or a SECTOR card (markets), never
# both. Sector cards render one chip per market and total themselves up.
#
# count: how a card's provider tally is resolved. `from` picks the strategy,
# `key` names the file under _data/.
#   from: total  -> site.data[key].total
#   from: size   -> number of entries in site.data[key]
#   from: sum    -> sum of the sizes of every group in site.data[key]
#   (sector cards need no count — the include sums their markets)
#
# Do NOT rename `from`/`key` to `size`, `first`, or `last`. Liquid resolves
# those as built-in properties on the hash before it looks for your key, so
# the lookup silently returns the wrong value.

- id: browse
  title: Browse
  intro: Cross-cutting indexes over every provider tracked on the network.
  columns: col-md-4
  cards:

    - name: Alphabetical
      icon: sort_by_alpha
      unit: providers
      count: { from: sum, key: providers }
      description: Every provider tracked across the API Evangelist network, sorted A–Z.
      href: /alphabetical/
      cta: Browse A–Z

    - name: Industries
      icon: factory
      unit: industries
      count: { from: size, key: sections-industries }
      description: Providers organized by the industries they operate in, from aerospace to waste management.
      href: /industries/
      cta: Browse Industries

    - name: Countries
      icon: public
      unit: countries
      count: { from: size, key: sections-countries }
      description: Providers across the top industrial countries in the world, matched by country tags.
      href: /countries/
      cta: Browse Countries

- id: sectors
  title: Sectors
