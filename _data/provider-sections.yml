- id: kin-score
  title: Kin Score
  intro: Every provider on the network sorted into the five Kin Score bands.
  columns: col-md-4 col-lg
  compact: true
  cards:

    - name: Exemplar
      icon: workspace_premium
      unit: providers
      count: { from: total, key: providers-exemplar }
      description: Comprehensive API programs with full governance and excellent developer experience.
      href: /exemplar/
      cta: View Exemplar
      card_class: border-success
      title_class: text-success
      icon_class: text-success
      btn_class: btn-success

    - name: Strong
      icon: verified
      unit: providers
      count: { from: total, key: providers-strong }
      description: Solid governance, documentation, and developer tooling across the API program.
      href: /strong/
      cta: View Strong
      icon_class: text-primary
      btn_class: btn-outline-primary

    - name: Developing
      icon: trending_up
      unit: providers
      count: { from: total, key: providers-developing }
      description: Making good progress toward a complete and well-governed API program.
      href: /developing/
      cta: View Developing
      icon_class: text-warning
      btn_class: btn-outline-warning

    - name: Thin
      icon: radio_button_unchecked
      unit: providers
      count: { from: total, key: providers-thin }
      description: Basic API presence with limited governance, tooling, or documentation.
      href: /thin/
      cta: View Thin
      icon_class: text-secondary
      btn_class: btn-outline-secondary

    - name: Minimal
      icon: fiber_manual_record
      unit: providers
      count: { from: total, key: providers-minimal }
      description: Minimal API program signals detected on the network.
      href: /minimal/
      cta: View Minimal
      icon_class: text-secondary
      btn_class: btn-outline-secondary
