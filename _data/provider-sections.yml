  columns: col-md-6
  cards:

    - name: Banking
      icon: account_balance
      description: >-
        Banks, credit unions, and building societies ranked by their Kin Score across four
        markets — from the CDR and Open Banking mandates to the voluntary open-finance regimes.
      markets:
        - name: United States
          href: /us-banks/
          count: { from: total, key: providers-us-banks }
        - name: United Kingdom
          href: /uk-banks/
          count: { from: total, key: providers-uk-banks }
        - name: Australia
          href: /australian-banks/
          count: { from: total, key: providers-australian-banks }
        - name: Canada
          href: /canadian-banks/
          count: { from: total, key: providers-canadian-banks }

    - name: Payments
