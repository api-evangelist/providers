# ---------------------------------------------------------------------------
# provenance (schema 0.6+) — WHO PUBLISHED THE ARTIFACT.
#
# The rubric's core claim is that it measures what a provider actually ships.
# Through 0.5.1 it could not: a spec, an MCP server or an agent skill authored
# by API Evangelist on a provider's behalf satisfied exactly the same check as
# one the provider published itself. In sectors where few providers publish
# anything, that stopped being noise and started deciding the standings.
#
# Three authorship states, and the third is the one energy forced into the
# model — an artifact can be genuinely provider-hosted and still not be the
# provider's own design:
#
#   first-party   the provider wrote it and serves it            credit 1.00
#   conformance   the provider serves a standards body's document credit 0.75
#   derived       API Evangelist authored it on their behalf      credit 0.25
#   unknown       no marker either way                            credit 1.00
#
# `derived` keeps a floor rather than scoring zero because a groundable derived
# candidate is not worthless — it is a real, fetchable artifact one adapter away
# from working, and an agent shopping the catalog can use it. It is simply not
# evidence about the provider, so it must never outrank the real thing.
#
# `unknown` is credited IN FULL, deliberately. Only artifacts this pipeline
# authored carry a marker, so an unmarked artifact is far more likely to be a
# harvested provider-published one than an unlabelled derivation. Scoring
# `unknown` as derived would punish providers for a gap in our own metadata.
# The honest cost of that choice: OpenAPI marker coverage is 2.6% (2,274 of
# 87,612 specs), so contract provenance is a FLOOR, not a census, and the
# `provenance_coverage` figure is published beside the score rather than hidden.
# Backfilling x-provenance across the OpenAPI corpus is collection work, and it
# is the single highest-value thing that would sharpen this release.
#
# Source of truth: signals/_data/provenance.json, rebuilt by
# `python3 signals/build_provenance.py` before every scoring pass.
# ---------------------------------------------------------------------------
provenance:
  credit:
    first-party: 1.00
    conformance: 0.75
    derived: 0.25
    unknown: 1.00
  # Checks and dimensions whose award is multiplied by the authorship credit of
  # the artifact class named here. Everything else is unaffected.
  applies_to:
    mcp_server_present: mcp            # developer_ergonomics, 4 pts
    agent_skill_present: skills        # developer_ergonomics, 3 pts
    contract_present: openapi          # contract_quality, 20 pts
    mcp_server: mcp                    # agent readiness, 12 pts
    agent_skills: skills               # agent readiness, 5 pts
    asyncapi_events: asyncapi          # agent readiness, 6 pts
    agentic_access: agentic_access     # agent readiness, 10 pts
    conformance_declared: conformance  # governance, 6 pts

# ---------------------------------------------------------------------------
# Facet weights for the composite provider score.
# Must sum to 1.0. Tune to dial in what "good" means for apis.io search.
# ---------------------------------------------------------------------------
facets:
  discoverability:
    weight: 0.10
    label: Discoverability
    description: >
      Can the API be found and understood from machine-readable metadata
      alone? Driven by apis.yml completeness, tagging, and identity signals.
  contract_quality:
    weight: 0.25
    label: Contract Quality
    description: >
      Technical depth and richness of the API contract artifacts —
      OpenAPI, AsyncAPI, JSON Schema, JSON-LD.
  governance:
    weight: 0.12
    label: Governance
    description: >
      Outcomes of Spectral linting and presence of governance artifacts
      (rulesets, vocabulary). Severity-weighted.
  operational_transparency:
    weight: 0.13
    label: Operational Transparency
    description: >
      Does the provider expose how the API behaves operationally?
      Rate limits, status, change log, deprecation, security disclosure.
  developer_ergonomics:
    weight: 0.20
    label: Developer Ergonomics
    description: >
      How easy is it to get started? SDKs, CLI, portal, getting-started,
      documentation, sandbox/console, MCP server, and authentication clarity.
  commercial_clarity:
    weight: 0.20
    label: Commercial Clarity
    description: >
      Are commercial terms machine-readable? Plans, pricing, sign-up,
      terms of service, privacy, finops mapping, compliance/trust.
  regulatory:
    weight: 0.15
    conditional: true          # only applies to regulated industries (see industry_regulatory)
    label: Regulatory Posture
    description: >
      For providers in a regulated industry ONLY: does the API publish the
      consent, security, legal, and standards-conformance posture its regime
      demands? Consent-scoped authorization (OAuth/OIDC scopes), a published
      security + vulnerability-disclosure posture, terms/privacy as legal basis,
      and evidence of conformance to the industry's data standard. Not applied
      to unregulated industries — see the composite math note below.

# ---------------------------------------------------------------------------
# Conditional composite math (schema 0.5+)
#
# The six base facets above have weights that sum to 1.0. The `regulatory` facet
# is CONDITIONAL: it is folded into the composite only when the provider's tags
# match a regime in `industry_regulatory`. The math, per provider:
#
#   base       = Σ(base_weight[f] × facet[f])      # 6 facets, weights sum to 1.0
#   if regulated:
#     composite = (1 − 0.15) × base + 0.15 × facet[regulatory]
#   else:
#     composite = base                             # unchanged from 0.4
#
# So an unregulated provider's score never moves; a regulated provider that
# publishes no regulatory posture takes a real hit (0.15 × 0), and one that
# publishes a strong posture is rewarded. Regulatory is always computed and
# stored (so the panel renders for regulated providers), but only enters the
# composite when the regime applies.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# industry_regulatory — the applicability map. A provider is "regulated" when
# any of its (case-insensitive) tags match a regime's `tags`. This map is the
# knob to iterate as new sectors are scored — add a regime or widen its tags
# here, never in code. Tags are matched against the provider's top-level `tags`.
#
# MATCHING CHANGED IN 0.6 — MOST SPECIFIC WINS, NOT FIRST DECLARED.
# 0.5 took the first regime in declaration order that matched any tag, and that
# produced a confirmed, measured bug: `securities_market_data` claimed the bare
# tags `broker`, `brokerage` and `exchange`, which insurance brokers, broker
# networks and brokerage-technology vendors match cleanly. Sixteen of 35 UK, ten
# of 20 Canadian and seven of 20 Australian insurance organizations were scored
# against MiFID II — Beazley, a Lloyd's syndicate, among them. The `insurance`
# regime existed and was well drawn; it was simply losing a race it should
# never have been in.
#
# 0.6 scores EVERY matching regime and keeps the one with the most tag hits,
# breaking ties by `specificity` (higher wins) and then declaration order. A
# Lloyd's syndicate tagged `insurance, broker, underwriting, claims` now returns
# three hits for insurance against one for securities and lands correctly.
# The ambiguous tags are additionally demoted out of `tags` into `weak_tags`,
# which count toward a match only when no strong tag matched anywhere.
# ---------------------------------------------------------------------------
industry_regulatory:
  banking_open_finance:
    label: Banking & Open Finance
    specificity: 3
    regimes: [CDR (Australia), UK Open Banking, PSD2/PSD3 (EU), 1033 (US), FDX]
    basis: >
      Consumer-permissioned data sharing and payment access, mandated or
      standardized: consent-scoped OAuth/OIDC (often FAPI), a named data
      standard, and a security + disclosure posture.
    tags: [banks, banking, open banking, open finance, cdr, consumer data right,
           psd2, psd3, 1033, fdx, consumer banking, neobank, building society,
           credit union, mutual bank, digital bank]
    standards: [obie, uk-open-banking, cdr-banking, consumer-data-standards, fdx,
                berlin-group-nextgenpsd2, fapi, fapi-2]
  securities_market_data:
    label: Securities & Market Data
    specificity: 2
    regimes: [MiFID II (EU), SEC/FINRA (US), exchange data licensing, market-data redistribution]
    basis: >
      Licensed market data and securities activity: entitlement and
      redistribution terms, licensing/compliance disclosure, and auditability.
    tags: [market data, securities, stock exchange, order execution,
           mifid, mifid ii, finra, sec, otc, derivatives, equities, market-data]
    # `broker`, `brokerage` and `exchange` are shared with insurance, freight,
    # energy and crypto. They match ONLY when nothing else matched — see the
    # note on most-specific matching above.
    weak_tags: [exchange, brokerage, broker, trading]
    standards: [fix-protocol, mifid-ii, iso-20022]
  health:
    label: Health
    specificity: 3
    regimes: [HIPAA (US), FHIR / US Core, 21st Century Cures Act, EHDS (EU)]
    basis: >
      Protected health information and interoperability mandates: FHIR
      conformance, consent, HIPAA-grade security, and info-blocking posture.
    tags: [health, healthcare, clinical, ehr, emr, fhir, medical, patient,
           health data, life sciences, pharma, telehealth, payer, provider network]
    standards: [fhir, smart-on-fhir, us-core, uscdi, da-vinci, carin-blue-button,
                fhir-bulk-data, cds-hooks, c-cda, hl7-v2, dicom]
  payments:
    label: Payments
    specificity: 3
    regimes: [PCI-DSS, card-network rules, SCA/PSD2, ISO 20022]
    basis: >
      Cardholder and payment data: PCI-DSS scope, strong customer
      authentication, and a security + disclosure posture.
    tags: [payments, payment, card, cards, acquiring, issuing, pci, pci-dss,
           merchant, checkout, wallet, payment gateway]
    standards: [pci-dss, 3-d-secure, iso-20022, confirmation-of-payee, emv,
                psd2-sca, open-payments]
  insurance:
    label: Insurance
    specificity: 4
    regimes: [NAIC/solvency, open insurance, IDD (EU), state DOI rules]
    basis: >
      Policyholder data and market conduct: consent, disclosure, and
      standards conformance where an open-insurance regime exists.
    tags: [insurance, insurtech, underwriting, claims, policy, actuarial,
           reinsurance, broker network, lloyds, syndicate, p&c, life insurance,
           health insurance, general insurance]
    standards: [acord, acord-al3, acord-xml, ngds, grlc, cieca-bms, csio,
                market-reform-contract]
  telecommunications:
    label: Telecommunications
    specificity: 4
    regimes: [FCC / Communications Act (CPNI), Ofcom / Communications Act 2003,
              ACMA / Telecommunications Act, ITU Constitution, ePrivacy Directive]
    basis: >
      Network capability exposed as an API, over exactly the subscriber data
      the CPNI and ePrivacy regimes restrict: number verification, SIM swap,
      device location, and the consent surface each requires. Added in 0.6 —
      scoring 83 telecom organizations under 0.5 fired the conditional facet for
      only seven of them, via Government, Payments and Health, leaving a sector
      supervised by four national regulators with no regulatory layer at all.
    tags: [telecom, telecommunications, telco, carrier, mobile network operator,
           mno, mvno, cpaas, sms, voice, messaging, network api, camara,
           open gateway, sim, roaming, number verification, subscriber]
    standards: [camara, tm-forum-open-api, gsma-open-gateway, ciba, 3gpp, mef, etsi]
  energy_utilities:
    label: Energy & Utilities
    specificity: 4
    regimes: [CDR Energy (Australia), Green Button / ESPI (North America),
              Smart Energy Code + DCC (GB), Ofgem Data Best Practice,
              FERC Order 889 / OASIS (US)]
    basis: >
      Customer energy data and network open data, both increasingly compelled:
      a consumer data right over usage and billing, and "presumed open" network
      data published under licence conditions. Added in 0.6 — the energy quartet
      measured a verified mandate as worth about twelve points of composite,
      the largest single effect in the series, against a regime that did not
      exist in the map.
    tags: [energy, utilities, utility, electricity, gas, power, grid, smart meter,
           smart metering, distribution network, dso, dno, energy retailer,
           green button, renewables, ev charging, water utility]
    standards: [green-button, espi, cds-energy, cds-common, smart-energy-code,
                ieee-2030-5, openadr]
  government:
    label: Government & Public Sector
    specificity: 2
    regimes: [FedRAMP, eIDAS (EU), open-data standards, national gov API policy]
    basis: >
      Public-sector data and identity: security authorization, accessibility,
      open-data standards, and identity/eIDAS conformance.
    tags: [government, public sector, gov, govtech, civic, municipal, federal,
           state government, open data, public data]
    standards: [dcat, ckan, eidas, fedramp, open-data-charter]

# ---------------------------------------------------------------------------
# Artifact-driven checks.
# Each check awards `points` toward `facet`. The facet's raw score is the sum
# of awarded points; it is then normalized against `max_raw_points` for that
# facet (computed at run time) to yield a 0–100 sub-score.
#
# All `rule` values are quoted free-text descriptions of the predicate the
# scorer should implement. The scorer is the source of truth for evaluation;
# this rubric is the source of truth for what counts and how much.
# ---------------------------------------------------------------------------
artifacts:

  # -------------------------------------------------------------------------
  # apis.yml (provider index)
  # -------------------------------------------------------------------------
  apis_yml:
    label: apis.yml
    spec: https://apisjson.org/
    description: >
      The provider's APIs.json index — the root document that makes everything else
      findable. Every other artifact in this rubric is discovered through it.
    checks:
      - id: apis_yml_present
        label: Publishes an apis.yml index
        facet: discoverability
        points: 10
        rule: 'source_filename == "apis.yml"'
        description: >
          The provider maintains a real APIs.json index rather than being catalogued
          from the outside. The single highest-value discoverability signal: it is the
          difference between a provider describing itself and being described.
      - id: description_substantive
        label: Substantive description
        facet: discoverability
        points: 5
        rule: 'len(description) >= 200'
        description: >
          At least 200 characters of description. Enough for a human or an agent to
          decide whether the API is relevant without opening the site.
      - id: tags_present
        label: Tagged for discovery
        facet: discoverability
        points: 5
        rule: 'len(tags) >= 5'
        description: >
          Five or more tags. Tags are how the API surfaces in topical search and how it
          gets placed into industries and areas rather than sitting unclassified.
      - id: image_present
        label: Provider image
        facet: discoverability
        points: 2
        rule: 'image is set'
        description: >
          A logo or image is referenced, so the provider renders as a recognizable card
          in search results and listings instead of a bare line of text.
      - id: maintainer_present
        label: Named maintainer
        facet: discoverability
        points: 3
        rule: 'maintainers[0].email is set'
        description: >
          A contactable maintainer email. Establishes that someone owns the index and
          gives consumers a route to reach them.
      - id: created_modified_dates
        label: Created and modified dates
        facet: discoverability
        points: 2
        rule: 'created and modified both ISO dates'
        description: >
          Both timestamps present as ISO dates, so freshness is machine-readable and a
          consumer can tell a maintained index from an abandoned one.
      - id: multiple_apis
        label: Indexes three or more APIs
        facet: discoverability
        points: 3
        rule: 'api_count >= 3'
        description: >
          The index covers a real surface rather than a single endpoint — evidence the
          provider is cataloguing their whole platform.
      - id: human_url_per_api
        label: Human URL on every API
        facet: discoverability
        points: 5
        rule: 'every api has humanURL'
        description: >
          Each indexed API points at documentation a person can read. Without it, an
          entry is a name with nowhere to go.
      - id: base_url_per_api
        label: Base URL on every API
        facet: discoverability
        points: 5
        rule: 'every api has baseURL and no baseURL contains "localhost"'
        description: >
          Each indexed API declares a real, callable base URL. A localhost base URL
          fails this check — it signals a spec that was published without ever being
          pointed at production.
      # --- 0.6: raise the bar from HUMAN findability to MACHINE discoverability
      # Measured across two quartets, 252 organizations: discoverability averages 84.6
      # and NOT ONE PROVIDER SCORES ZERO in any of eight markets — including thirteen US
      # utilities that publish no contract at all and score 0.0 on every one of the
      # agent-readiness dimensions. A facet a completely absent developer surface still
      # scores in the eighties is not carrying information. Its bar — a findable website,
      # documentation, support, terms — is met by any company with a marketing
      # department, which in a 25,000-provider catalog is nearly all of them.
      #
      # These three raise the bar rather than cutting the weight, which is the choice
      # more in keeping with the agentic thesis: for an agent, a beautifully designed
      # marketing site is not discoverability at all. Cloudflare's top-200k scan supplies
      # the adoption baseline these are cut against — 4% Content Signals, 3.9% markdown
      # negotiation, fewer than 15 sites in 200,000 carrying an MCP Server Card or API
      # catalog — which is the strongest external evidence yet that machine
      # discoverability discriminates exactly where human findability does not.
      - id: well_known_published
        label: Serves a .well-known surface
        facet: discoverability
        points: 6
        rule: 'well-known/ carries an api-catalog, security.txt, or a protected-resource doc'
        description: >
          The provider serves machine entrypoints at RFC 8615 well-known paths — an
          api-catalog linkset (RFC 9727), a security.txt, an OAuth protected-resource
          document. This is the address an agent tries FIRST, before it has read
          anything, and it is the discoverability signal a marketing site cannot fake.
      - id: llms_txt_published
        label: Publishes llms.txt
        facet: discoverability
        points: 4
        rule: 'llms/ carries an llms.txt'
        description: >
          An llms.txt — the provider stating, in a machine-readable file at a
          conventional path, what a language model should read to understand the
          product. Young, unratified, and adopted by 6,012 providers in this catalog,
          which makes it the fastest-moving machine-discoverability signal there is.
      - id: apis_json_self_hosted
        label: Self-hosts the APIs.json index
        facet: discoverability
        points: 4
        rule: 'apis.yml url points at a host the provider controls, not the catalog'
        description: >
          The provider serves its own APIs.json index from its own domain rather than
          being catalogued from the outside. `apis_yml_present` above rewards the index
          existing; this rewards the provider OWNING it — the difference between
          describing yourself and being described.

  # -------------------------------------------------------------------------
  # OpenAPI specifications
  # -------------------------------------------------------------------------
  openapi:
    label: OpenAPI
    spec: https://www.openapis.org/
    description: >
      The HTTP contract itself. These checks parse every OpenAPI document the provider
      publishes, so they measure what the spec actually contains rather than whether one
      exists. A provider with several specs earns credit proportional to how many pass.
    checks:
      - id: contract_present
        label: Publishes a machine-readable contract
        facet: contract_quality
        points: 20
        provenance: openapi
        rule: 'at least one OpenAPI, AsyncAPI, GraphQL SDL or FHIR CapabilityStatement'
        description: >
          At least one machine-readable contract exists, in ANY format the ecosystem
          actually uses. The largest single award in the rubric, because nearly every
          downstream capability — SDK generation, mocking, linting, agent tool-calling —
          is unlocked by having a contract at all.

          CONTRACT-TYPE-AGNOSTIC IN 0.6, and renamed from `openapi_present` to say so.
          Through 0.5.1 this check read OpenAPI and AsyncAPI only, which meant entire
          FHIR-native, GraphQL-native and EDI-native markets were recorded as having no
          contract for a format the rubric simply declined to read. Epic served a
          59-resource FHIR R4 CapabilityStatement — plus STU3, DSTU2 and a
          smart-configuration — and read `spec_presence: false`, `contract_quality: 22.6`.
          That was a measurement artifact, not a judgment about Epic.

          PROVENANCE-GRADED IN 0.6. An API-Evangelist-modeled spec credits at 0.25.
          A provider-served contract you can download should outrank one written on the
          provider's behalf, and until 0.6 they were indistinguishable.
      - id: openapi_3_1
        label: OpenAPI 3.1
        facet: contract_quality
        points: 5
        rule: 'openapi version is 3.1.x'
        description: >
          Published against 3.1, which aligns with modern JSON Schema and supports
          webhooks natively. Scored above 3.0 rather than instead of it.
      - id: openapi_3_0
        label: OpenAPI 3.0
        facet: contract_quality
        points: 3
        rule: 'openapi version is 3.0.x'
        description: >
          Published against 3.0. Still widely tooled and a long way ahead of Swagger 2.0,
          but no longer where the specification is moving.
      - id: info_complete
        label: Complete info block
        facet: contract_quality
        points: 4
        rule: 'info has title, description (>= 50 chars), version, contact'
        description: >
          Title, a description of real length, a version, and a contact. The metadata a
          consumer needs to identify and reach the API's owner.
      - id: servers_defined
        label: Real servers declared
        facet: contract_quality
        points: 3
        rule: 'servers[] non-empty and not localhost'
        description: >
          The spec points at a callable host. A localhost server fails — a contract you
          cannot call is documentation, not an interface.
      - id: servers_resolvable
        label: Servers resolve to a real host
        facet: contract_quality
        points: 5
        graded: true
        rule: 'share of specs whose servers[].url carries a registrable domain, not a
               placeholder host or a bare template variable'
        description: >
          NEW IN 0.6. A specification can be genuinely provider-published, verbatim, and
          still be uncallable. Every CAMARA server declaration in the entire telecom stack
          is the template variable `{apiRoot}` and every openIdConnectUrl is a CAMARA
          placeholder pointing at example.com — across 19 standards and exposure
          repositories there was exactly one absolute base URL. Insurance produced the
          same defect from the other direction: Majesco declares api.majesco.example.com
          and ACORD api.insurer-internal.example.com. The rubric scored all of it as full
          contract quality.

          Graded on the SHARE of a provider's specs that carry a resolvable host, so a
          provider with one placeholder spec among twenty is not treated like one whose
          entire surface is uncallable. Catalog-wide at 0.6: 10,950 of 87,612 specs are
          uncallable as published, and 834 providers hold no spec with a resolvable host
          at all.

          The distinction that took care to get right: a TEMPLATED host that still carries
          a real domain — `https://{region}.api.acme.com`, or Yardi's
          `https://{server}.yardi.com/{clientUrl}/webservices` — passes. A consumer with
          the variable filled in reaches a host that exists. Only a host that is nothing
          but substitution variables, or a known placeholder domain, fails. A naive
          "contains a brace" test would have failed a large share of perfectly callable
          multi-region specs, and a naive full-text grep for example.com over the catalog
          returned 4,320 false positives, because real specs mention example.com in their
          EXAMPLES. This check parses the `servers` block specifically.
      - id: operations_summary_coverage
        label: Operations have summaries
        facet: contract_quality
        points: 6
        rule: '>= 80% of operations have summary'
        description: >
          At least 80% of operations carry a summary. Summaries are what render in
          reference docs and what an agent reads to pick the right operation.
      - id: operations_description_coverage
        label: Operations have descriptions
        facet: contract_quality
        points: 6
        rule: '>= 80% of operations have description'
        description: >
          At least 80% of operations carry a description. The difference between knowing
          an operation's name and knowing what it does.
      - id: operations_tagged
        label: Operations are tagged
        facet: contract_quality
        points: 4
        rule: '>= 80% of operations have tags'
        description: >
          At least 80% of operations are tagged, which is what groups a reference into
          navigable sections instead of one flat list of endpoints.
      - id: operations_operation_ids
        label: Unique operationIds
        facet: contract_quality
        points: 4
        rule: '100% of operations have unique operationId'
        description: >
          Every operation has a unique operationId. Required for clean SDK method names
          and stable agent tool names; duplicates silently break both.
      - id: response_coverage
        label: Success responses defined
        facet: contract_quality
        points: 5
        rule: 'every operation defines >= one 2xx response'
        description: >
          Every operation documents at least one success response, so a consumer knows
          the shape of what they get back.
      - id: error_responses_documented
        label: Error responses documented
        facet: contract_quality
        points: 4
        rule: '>= 50% of operations define a 4xx response schema'
        description: >
          At least half of operations document a 4xx response schema. The most commonly
          skipped part of a contract, and the part integrators need most when things go
          wrong.
      - id: examples_present
        label: Examples present
        facet: contract_quality
        points: 4
        graded: true
        rule: 'share of operations carrying a request or response example'
        description: >
          GRADED IN 0.6, previously a bit. As a boolean this check fired on a single token
          example anywhere in the document, which meant it ran near-universally across
          payments and healthcare and carried almost no information. It now grades on the
          SHARE of operations that actually carry a request or response example, so a
          provider who documents every operation outscores one who documented a single
          one. Examples are the cheapest way an agent learns a payload shape before it
          ever makes a call, and "the spec contains the string example:" was never
          evidence of that.
      - id: components_reuse
        label: Reusable components
        facet: contract_quality
        points: 3
        rule: 'components.schemas count >= 5 and used via $ref'
        description: >
          Five or more component schemas, actually referenced via $ref. Evidence the
          spec is modelled rather than copy-pasted per endpoint.
      - id: security_schemes_defined
        label: Security schemes defined
        facet: contract_quality
        points: 4
        rule: 'components.securitySchemes non-empty'
        description: >
          The spec declares how authentication works, so a consumer can authenticate
          from the contract without hunting through prose docs.
      - id: security_applied
        label: Security applied to operations
        facet: contract_quality
        points: 3
        rule: 'security applied globally or per-operation'
        description: >
          Declared schemes are actually bound to operations, globally or individually.
          A scheme defined but never applied tells a consumer nothing about what a given
          call requires.
      - id: oauth_flows_current
        label: Declares no deprecated OAuth grant
        facet: contract_quality
        points: 4
        rule: 'no securityScheme declares the implicit or resource-owner-password OAuth grant'
        description: >
          NEW IN 0.7. The implicit grant returns an access token in the browser redirect
          fragment; the password grant has the client handle the user's credentials directly.
          Both are recommended against by the OAuth 2.0 Security BCP (RFC 9700) and removed
          outright in OAuth 2.1. Measured across 14,195 published contracts, 775 still declare
          implicit and 72 declare password - 28.9% of every OAuth-using contract. Vacuously
          satisfied by a contract declaring no OAuth: this scores the PRESENCE of a deprecated
          flow, not the absence of OAuth.
      - id: credentials_not_in_query
        label: Keeps credentials out of the query string
        facet: contract_quality
        points: 3
        rule: 'no apiKey securityScheme declares in: query'
        description: >
          NEW IN 0.7. An API key in the query string lands in server logs, proxy logs, browser
          history and referrer headers. 815 of 14,195 published contracts place the credential
          there. Vacuously satisfied where no apiKey scheme is declared.
      - id: oauth_scopes_enumerated
        label: Enumerates OAuth scopes
        facet: contract_quality
        points: 4
        rule: 'every declared oauth2 flow enumerates at least one scope'
        description: >
          NEW IN 0.7. Scope is how OAuth expresses least privilege - the difference between a
          token that can read a calendar and one that can delete an account. Only 15.3% of
          published contracts enumerate any scope, so roughly four in five OAuth-declaring
          contracts describe how to obtain a credential and never what it permits. This is the
          mechanism behind the missing least-privilege models found in every market report.
          Distinct from reg_oauth_scopes, which applies only where a regulatory regime does;
          this one applies to every provider. Vacuously satisfied without OAuth.
      - id: webhooks_or_callbacks
        label: Webhooks or callbacks
        facet: contract_quality
        points: 2
        rule: 'webhooks or callbacks defined (3.1) or callbacks (3.0)'
        description: >
          The spec describes what the API sends back out, not only what it receives —
          the event surface most providers document only in prose, if at all.

  # -------------------------------------------------------------------------
  # AsyncAPI specifications
  # -------------------------------------------------------------------------
  asyncapi:
    label: AsyncAPI
    spec: https://www.asyncapi.com/
    description: >
      The event-driven contract. Only 213 AsyncAPI documents exist across the entire
      catalog, so these checks are N/A for most providers — a provider with no event
      surface is not penalized for the absence, and these points are excluded from
      their denominator entirely.
    checks:
      - id: asyncapi_present
        label: Publishes an AsyncAPI spec
        facet: contract_quality
        points: 12
        rule: 'at least one api has spec_type == "AsyncAPI"'
        description: >
          At least one AsyncAPI document exists, describing the messaging or streaming
          surface with the same rigor the OpenAPI applies to the request/response one.
      - id: asyncapi_3_x
        label: AsyncAPI 3.x
        facet: contract_quality
        points: 4
        rule: 'asyncapi version is 3.x'
        description: >
          Published against 3.x, which separates channels from operations and is where
          the specification's tooling is consolidating.
      - id: channels_defined
        label: Channels defined
        facet: contract_quality
        points: 4
        rule: 'channels[] non-empty'
        description: >
          The spec declares the channels messages flow over — the event equivalent of
          declaring paths.
      - id: messages_with_schema
        label: Messages carry payload schemas
        facet: contract_quality
        points: 5
        rule: '>= 80% of messages reference a payload schema'
        description: >
          At least 80% of messages reference a payload schema, so a subscriber knows the
          shape of what arrives rather than discovering it at runtime.
      - id: server_bindings
        label: Protocol bindings on servers
        facet: contract_quality
        points: 3
        rule: 'servers define protocol bindings'
        description: >
          Servers declare their protocol bindings — Kafka, AMQP, WebSocket, MQTT — which
          is what makes the contract actually connectable.
      - id: security_schemes
        label: Server security schemes
        facet: contract_quality
        points: 3
        rule: 'securitySchemes defined for at least one server'
        description: >
          At least one server declares how to authenticate against it.

  # -------------------------------------------------------------------------
  # GraphQL — a first-class contract type as of 0.6
  #
  # 1,089 providers publish a GraphQL SDL and the rubric could not read a line of
  # it, so a GraphQL-native company registered as having no contract at all. Like
  # AsyncAPI, these checks are N/A for providers with no GraphQL surface — nobody
  # is penalized for not being a GraphQL shop.
  # -------------------------------------------------------------------------
  graphql:
    label: GraphQL
    spec: https://spec.graphql.org/
    description: >
      The GraphQL schema definition. A published SDL is a machine-readable contract in
      exactly the sense the contract facet means: introspectable, codegen-ready, and
      sufficient for an agent to construct a valid query without reading prose.
    checks:
      - id: graphql_sdl_present
        label: Publishes a GraphQL schema
        facet: contract_quality
        points: 10
        rule: 'a .graphql / .gql SDL is published'
        description: >
          A schema definition file is published rather than only an interactive
          playground. An endpoint with introspection disabled and no published SDL is,
          to a consumer building against it, an undocumented API.
      - id: graphql_type_depth
        label: Schema defines a real type system
        facet: contract_quality
        points: 5
        rule: 'SDL declares >= 20 type definitions'
        description: >
          Twenty or more type definitions — a modelled domain rather than a handful of
          wrapper types around a REST passthrough.
      - id: graphql_descriptions
        label: Schema is documented
        facet: contract_quality
        points: 4
        rule: '>= 50% of type definitions carry a description string'
        description: >
          Half or more of the declared types carry description strings. In GraphQL the
          docstring IS the reference documentation — it is what renders in every
          explorer and what an agent reads to pick a field.

  # -------------------------------------------------------------------------
  # FHIR — a first-class contract type as of 0.6
  #
  # A FHIR CapabilityStatement is the health sector's OpenAPI: a machine-readable
  # declaration of every resource and interaction a server supports. Scoring US
  # healthcare made the omission concrete — Epic read spec_presence: false and
  # contract_quality 22.6 while serving a 59-resource R4 CapabilityStatement, and
  # 1upHealth read the same 22.6 on a 144-resource statement.
  #
  # HONEST LIMITATION AT 0.6: only 22 CapabilityStatements are held across 11
  # providers, so this check corrects the rubric but cannot yet correct the
  # sector — harvesting statements from the FHIR-native cohort is collection work
  # that has to follow. The check ships now so the collection has somewhere to land.
  # -------------------------------------------------------------------------
  fhir:
    label: FHIR
    spec: https://hl7.org/fhir/capabilitystatement.html
    description: >
      The FHIR conformance surface — a CapabilityStatement declaring the resources,
      interactions, search parameters and profiles a server actually supports.
    checks:
      - id: fhir_capability_statement
        label: Publishes a FHIR CapabilityStatement
        facet: contract_quality
        points: 12
        rule: 'a CapabilityStatement / Conformance resource is published'
        description: >
          The server publishes its conformance statement. This is the FHIR equivalent of
          shipping an OpenAPI, and it is served at a well-known path by every conformant
          server, which makes its absence a deliberate omission rather than an oversight.
      - id: fhir_resource_coverage
        label: Broad resource coverage
        facet: contract_quality
        points: 6
        rule: 'CapabilityStatement declares >= 20 resources'
        description: >
          Twenty or more resources declared — the difference between a server that
          supports Patient and Observation and one that supports a working clinical
          record.

  # -------------------------------------------------------------------------
  # JSON Schema artifacts
  # -------------------------------------------------------------------------
  json_schema:
    label: JSON Schema
    spec: https://json-schema.org/
    description: >
      Schemas published as standalone, addressable artifacts rather than only inlined in
      a spec — reusable across specs, validators, and codegen.
    checks:
      - id: json_schema_present
        label: Publishes JSON Schema
        facet: contract_quality
        points: 6
        rule: 'at least one api property has type == "JSONSchema"'
        description: >
          At least one JSON Schema is published as its own artifact, so the data model
          can be validated against and reused independently of any single API.
      - id: json_schema_per_resource
        label: Schema per resource
        facet: contract_quality
        points: 4
        rule: 'schemas extracted per primary resource (>= 2)'
        description: >
          Two or more schemas, broken out per primary resource rather than one catch-all
          document — evidence the data model is decomposed.

  # -------------------------------------------------------------------------
  # JSON-LD / semantic context
  # -------------------------------------------------------------------------
  json_ld:
    label: JSON-LD
    spec: https://json-ld.org/
    description: >
      Semantic context — what the API's terms actually mean, linked to shared
      vocabularies. The thinnest-populated artifact in the catalog, and the one that
      most separates an API a machine can call from one a machine can reason about.
    checks:
      - id: json_ld_present
        label: Publishes a JSON-LD context
        facet: contract_quality
        points: 5
        rule: 'at least one jsonld context defined'
        description: >
          At least one JSON-LD context is defined, binding the API's terms to shared
          semantics instead of leaving field names to be guessed from spelling.
      - id: json_ld_class_depth
        label: Context defines classes
        facet: contract_quality
        points: 3
        rule: 'any jsonld context has class_count >= 5'
        description: >
          Five or more classes in a context — a modelled domain rather than a token
          gesture at semantics.
      - id: json_ld_property_depth
        label: Context defines properties
        facet: contract_quality
        points: 3
        rule: 'any jsonld context has property_count >= 10'
        description: >
          Ten or more properties, giving the classes enough detail to be useful to a
          consumer mapping the API onto their own model.

  # -------------------------------------------------------------------------
  # Spectral rules / governance
  # -------------------------------------------------------------------------
  spectral:
    label: Spectral Rules
    spec: https://stoplight.io/open-source/spectral
    description: >
      Published governance — the rules a provider holds their own API to, and the
      outcome of running them. This facet rewards publishing a ruleset AND passing it;
      a large ruleset that throws errors on the provider's own spec scores below a
      modest one that passes clean.
    checks:
      - id: rules_present
        label: Publishes a ruleset
        facet: governance
        points: 10
        rule: 'rules[0].rule_count >= 1'
        description: >
          A Spectral ruleset exists. The provider has written down what "good" means for
          their API surface instead of leaving it to reviewer taste.
      - id: rules_substantial
        label: Substantial ruleset
        facet: governance
        points: 5
        rule: 'rules[0].rule_count >= 20'
        description: >
          Twenty or more rules — a ruleset with real coverage rather than the handful
          that ship in a starter template.
      - id: low_error_density
        label: Low error density
        facet: governance
        points: 10
        rule: 'severity_counts.error / rule_count <= 0.20'
        description: >
          No more than 20% of rules fire at error severity against the provider's own
          specs. Measures whether governance is actually being met, not just declared.
      - id: zero_errors
        label: Clean lint
        facet: governance
        points: 5
        rule: 'severity_counts.error == 0'
        description: >
          The provider's specs pass their own ruleset with zero errors. Awarded on top
          of low error density.
      - id: balanced_severities
        label: Balanced severities
        facet: governance
        points: 3
        rule: 'warn and info both > 0'
        description: >
          The ruleset uses warn and info, not only error. A ruleset where everything is
          an error cannot express guidance — only refusal.
      - id: vocabulary_published
        label: Publishes a vocabulary
        facet: governance
        points: 5
        rule: 'common[].type includes "Vocabulary"'
        description: >
          A controlled vocabulary is published, so the provider's naming is a documented
          decision rather than an accident of whoever wrote each endpoint.
      # --- 0.6: broaden the facet beyond "did you ship a Spectral file"
      # governance (0.12) was effectively a single check and scored ~0 across all six
      # sectors measured — 63 of 79 US insurance organizations at zero, 34 of 35 UK, 19
      # of 20 Canadian, 66 of 83 in telecom. That is honest (almost nobody publishes a
      # public ruleset) but it wastes the facet. These credit the OTHER ways a provider
      # demonstrates it has internalized a standard.
      - id: conformance_declared
        label: Declared conformance profile
        facet: governance
        points: 6
        provenance: conformance
        rule: 'a conformance/ artifact declares conformance to named standards'
        description: >
          The provider declares which standards it conforms to — FHIR, FAPI, PCI, ISO
          20022, CAMARA — as a machine-readable artifact resolving against the standards
          catalog, rather than as a logo on a marketing page.

          PROVENANCE-GRADED, and the grading is the whole point. Half the conformance
          artifacts in the catalog (1,881 of 3,784) are API-Evangelist-derived readings
          of a provider's specs, not claims the provider made. Only a first-party
          declaration earns full credit here.

          THE BOUNDARY THIS CHECK HOLDS: adopting someone else's standard is not
          governance. Telecom is full of organizations that joined CAMARA, TM Forum or
          GSMA Open Gateway and govern nothing; governance is what you do to yourself.
          This credits evidence of INTERNALIZATION — a declared profile, an overlay, a
          published lint posture — never bare membership in a programme.
      - id: overlay_published
        label: Publishes an OpenAPI Overlay
        facet: governance
        points: 4
        rule: 'overlays/ contains an OpenAPI Overlay document'
        description: >
          An OpenAPI Overlay — the provider expressing a repeatable, versioned
          transformation of its own contract rather than hand-editing it. Evidence of a
          spec pipeline, which is what governance looks like in practice.

  # -------------------------------------------------------------------------
  # Operational transparency — common links + extracted data
  # -------------------------------------------------------------------------
  operational:
    label: Operational Transparency
    description: >
      Does the provider expose how the API behaves in production — what it limits, when
      it breaks, what changed, and what is going away? These are the artifacts a team
      needs to depend on an API, as opposed to merely call it.
    checks:
      - id: change_log_present
        label: Change log
        facet: operational_transparency
        points: 6
        rule: 'common[].type includes "ChangeLog" (alias-aware)'
        description: >
          A published change log. The single most useful operational artifact: it lets a
          consumer see what moved without diffing the spec themselves.
      - id: status_page_present
        label: Status page
        facet: operational_transparency
        points: 6
        rule: 'common[].type includes "StatusPage"'
        description: >
          A status page exists, so an integrator debugging a failure can tell "the API is
          down" from "my code is broken" without filing a ticket.
      - id: rate_limits_documented
        label: Rate limits documented
        facet: operational_transparency
        points: 8
        rule: 'rate_limits[0].limit_count >= 1'
        description: >
          Rate limits are published as machine-readable data. The heaviest award in this
          facet — undocumented limits are the most common cause of an integration that
          works in development and fails under load.
      - id: rate_limits_rich
        label: Rate limits detailed
        facet: operational_transparency
        points: 4
        rule: 'rate_limits[0].limit_count >= 3'
        description: >
          Three or more distinct limits, reflecting how the API actually tiers and
          throttles rather than a single blanket number.
      - id: deprecation_policy
        label: Deprecation policy
        facet: operational_transparency
        points: 3
        rule: 'common[].type includes "Deprecation" (alias-aware)'
        description: >
          A stated deprecation policy — how much notice a consumer gets before something
          they depend on is removed.
      - id: security_disclosure
        label: Security disclosure
        facet: operational_transparency
        points: 4
        rule: 'common[].type includes "Security" (alias-aware)'
        description: >
          A route for reporting vulnerabilities. Its absence tells a security researcher
          to go public instead.
      - id: webhooks_advertised
        label: Webhooks advertised
        facet: operational_transparency
        points: 3
        rule: 'common[].type includes "Webhooks"'
        description: >
          The provider advertises a webhook surface, so consumers can react to events
          rather than poll for them.
      - id: github_org_present
        label: GitHub organization
        facet: operational_transparency
        points: 2
        rule: 'common[].type includes "GitHubOrganization" (alias-aware)'
        description: >
          A public GitHub organization — where SDKs, specs, and issues live in the open.
      - id: roadmap_present
        label: Public roadmap
        facet: operational_transparency
        points: 2
        rule: 'common[].type includes "RoadMap" or "Roadmap"'
        description: >
          A public roadmap, letting consumers plan against where the API is going rather
          than only where it is.

  # -------------------------------------------------------------------------
  # Developer ergonomics — how easy is it to start using the API?
  # -------------------------------------------------------------------------
  ergonomics:
    label: Developer Ergonomics
    description: >
      How far is a newcomer from their first successful call? These checks track the
      on-ramp — portal, quickstart, auth docs, SDKs, sandbox — plus the newer agent-facing
      entry points (MCP servers and Agent Skills) that increasingly serve the same purpose
      for a non-human consumer.
    checks:
      - id: portal_present
        label: Developer portal
        facet: developer_ergonomics
        points: 4
        rule: 'common[].type includes "DeveloperPortal" (alias-aware)'
        description: >
          A dedicated developer portal — one front door, rather than API information
          scattered through a marketing site.
      - id: documentation_present
        label: Documentation
        facet: developer_ergonomics
        points: 4
        rule: 'common[].type includes "Documentation"'
        description: >
          Narrative documentation explaining how the API works and how to use it.
      - id: api_reference_present
        label: API reference
        facet: developer_ergonomics
        points: 3
        rule: 'common[].type includes "APIReference" (alias-aware)'
        description: >
          A complete endpoint-level reference — distinct from narrative docs, and what a
          developer returns to after their first call.
      - id: getting_started_present
        label: Getting started guide
        facet: developer_ergonomics
        points: 5
        rule: 'common[].type includes "GettingStarted" or "Quickstart"'
        description: >
          An explicit quickstart. The artifact most correlated with a developer reaching
          a first successful call, which is why it outscores the reference itself.
      - id: authentication_documented
        label: Authentication documented
        facet: developer_ergonomics
        points: 5
        rule: 'common[].type includes "Authentication"'
        description: >
          Authentication is documented as its own topic. Auth is where most integrations
          stall, and burying it inside a general guide is where most developers give up.
      - id: sdk_count_1
        label: At least one SDK
        facet: developer_ergonomics
        points: 3
        rule: 'count(common[].type == "SDK" alias-aware) >= 1'
        description: >
          At least one client library, so a consumer is not writing HTTP plumbing before
          writing anything of their own.
      - id: sdk_count_3
        label: Three or more SDKs
        facet: developer_ergonomics
        points: 4
        rule: 'count(common[].type == "SDK" alias-aware) >= 3'
        description: >
          Three or more languages covered — evidence of investment in a real developer
          audience rather than one favored stack. Awarded on top of the first SDK.
      - id: cli_present
        label: Command-line interface
        facet: developer_ergonomics
        points: 3
        rule: 'common[].type includes "CLI"'
        description: >
          A CLI, which is how the API gets used in scripts, CI, and exploration.
      - id: console_or_sandbox
        label: Console or sandbox
        facet: developer_ergonomics
        points: 3
        rule: 'common[].type includes "Console" or "Sandbox" or "Playground"'
        description: >
          Somewhere to try the API without wiring up credentials and a project first.
      - id: postman_present
        label: Postman collection
        facet: developer_ergonomics
        points: 2
        rule: 'common[].type includes "Postman" (alias-aware)'
        description: >
          A runnable collection — the fastest path from reading about the API to calling
          it.
      - id: mcp_server_present
        label: MCP server
        facet: developer_ergonomics
        points: 4
        provenance: mcp
        rule: 'common[].type includes "MCPServer", graded by whether the provider runs it'
        description: >
          A Model Context Protocol server, making the API directly callable by agents.
          Weighted alongside the strongest human on-ramps because it increasingly is one.

          PROVENANCE-GRADED IN 0.6, and this is where the defect was worst. 1,882 of the
          3,046 MCP artifacts in the catalog are API-Evangelist-derived CANDIDATES with
          `status: candidate` and `url: null` — 1,679 of them listed as an MCPServer in
          the provider's index, earning full credit for a server that does not exist.
          8x8's own artifact states that its 312-tool catalog "is a proposal, not an 8x8
          product." A derived candidate keeps a floor because it is a real, groundable
          artifact one adapter away from working; it can no longer outrank a running
          server.
      - id: agent_skill_present
        label: Agent Skill
        facet: developer_ergonomics
        points: 3
        provenance: skills
        rule: 'common[].type includes "AgentSkill", graded by who authored it'
        description: >
          A published Agent Skill — packaged instructions for an agent to use the API
          correctly, rather than leaving it to infer usage from the spec.

          PROVENANCE-GRADED IN 0.6: 2,018 of 2,274 skill sets in the catalog were
          generated by API Evangelist from the provider's own specs. Provider-published
          agent skills exist, but they are rare — across the whole telecom sector, three.
      - id: support_channel
        label: Support channel
        facet: developer_ergonomics
        points: 2
        rule: 'common[].type includes "Support" or "HelpCenter" or "Community"'
        description: >
          A route to a human or a community when the documentation runs out.
      - id: blog_present
        label: Blog
        facet: developer_ergonomics
        points: 1
        rule: 'common[].type includes "Blog"'
        description: >
          A blog. The lightest signal in the rubric, but a live one — it shows the API is
          still being talked about by the people who build it.

  # -------------------------------------------------------------------------
  # Commercial clarity — can a buyer evaluate the API without sales contact?
  # -------------------------------------------------------------------------
  commercial:
    label: Commercial Clarity
    description: >
      Can a team evaluate, adopt, and pay for this API without booking a sales call? This
      facet measures whether the commercial surface is as machine-readable as the
      technical one — the questions procurement and legal ask, answered in public.
    checks:
      - id: plans_present
        label: Plans published
        facet: commercial_clarity
        points: 8
        rule: 'plans[0].plan_count >= 1'
        description: >
          Access plans exist as structured, machine-readable data rather than a pricing
          page a human has to interpret. The heaviest award in this facet.
      - id: plans_multiple
        label: Multiple plans
        facet: commercial_clarity
        points: 4
        rule: 'plans[0].plan_count >= 3'
        description: >
          Three or more plans, describing a real tiering model — typically a free or
          trial tier through to production volume.
      - id: pricing_link
        label: Pricing published
        facet: commercial_clarity
        points: 4
        rule: 'common[].type includes "Pricing"'
        description: >
          Pricing is public. "Contact us" is an answer, but it is not this one.
      - id: sign_up_present
        label: Self-service sign-up
        facet: commercial_clarity
        points: 5
        rule: 'common[].type includes "SignUp" or "Login"'
        description: >
          A developer can get credentials themselves. Self-service sign-up is the line
          between an API you can try this afternoon and one you can try next quarter.
      - id: terms_of_service
        label: Terms of service
        facet: commercial_clarity
        points: 4
        rule: 'common[].type includes "TermsOfService" (alias-aware)'
        description: >
          Published terms — what a consumer is actually agreeing to when they call the
          API.
      - id: privacy_policy
        label: Privacy policy
        facet: commercial_clarity
        points: 4
        rule: 'common[].type includes "PrivacyPolicy" (alias-aware)'
        description: >
          A published privacy policy covering what happens to data passing through the
          API.
      - id: finops_mapped
        label: FinOps mapping
        facet: commercial_clarity
        points: 3
        rule: 'len(finops) >= 1'
        description: >
          Cost is mapped to usage in a machine-readable way, so consumption can be
          modelled and attributed rather than discovered on an invoice.
      - id: compliance_published
        label: Compliance published
        facet: commercial_clarity
        points: 3
        rule: 'common[].type includes "Compliance"'
        description: >
          Certifications and compliance posture are stated in public — SOC 2, ISO, HIPAA,
          GDPR — where a reviewer can find them without asking.
      - id: trust_center
        label: Trust center
        facet: commercial_clarity
        points: 3
        rule: 'common[].type includes "TrustCenter" or "Trust"'
        description: >
          A trust center consolidating security, compliance, and privacy posture into one
          place built for the person evaluating whether to depend on you.

  # -------------------------------------------------------------------------
  # regulatory — CONDITIONAL. These checks award to the `regulatory` facet,
  # which only enters the composite for providers matched by industry_regulatory
  # (see above). The checks are regime-agnostic in 0.5 — they measure the common
  # posture every regulated regime expects (consent-scoped auth, published
  # security + disclosure, legal basis, standards conformance). Regime-SPECIFIC
  # checks (e.g. FAPI for open banking, a FHIR capability statement for health)
  # are the intended next iteration; add them here with a `regime:` qualifier.
  # -------------------------------------------------------------------------
  regulatory:
    label: Regulatory Posture
    description: >
      The consent, security, legal, and standards-conformance posture a
      regulated-industry API is expected to publish. Scored only where a regime
      applies; sourced from signals already in the catalog.
    checks:
      - id: reg_oauth_scopes
        label: Consent-scoped authorization
        facet: regulatory
        points: 10
        rule: 'common[].type includes "OAuthScopes" OR a scopes artifact is present'
        description: >
          Published OAuth/OIDC scopes — the machine-readable expression of
          least-privilege, consented access every data-sharing regime is built
          on. The single strongest regulatory signal.
      - id: reg_authentication_documented
        label: Authentication model documented
        facet: regulatory
        points: 6
        rule: 'common[].type includes "Authentication" or "OpenIDConnect"'
        description: >
          A documented authentication/authorization model (OIDC, mTLS, PAR).
          A regulated API that will not say how it authenticates cannot be
          trusted to hold the line the regime draws.
      - id: reg_security_disclosure
        label: Security posture published
        facet: regulatory
        points: 6
        rule: 'common[].type includes "Security" or "DomainSecurity"'
        description: >
          A published security policy or domain-security posture. Regulated
          data demands a stated, verifiable security stance, not an assumed one.
      - id: reg_vulnerability_disclosure
        label: Vulnerability disclosure program
        facet: regulatory
        points: 6
        rule: 'common[].type includes "VulnerabilityDisclosure"'
        description: >
          A VDP / responsible-disclosure channel. For a regulated provider this
          is table stakes, and its absence is a conspicuous gap.
      - id: reg_terms_of_service
        label: Terms of service (legal basis)
        facet: regulatory
        points: 4
        rule: 'common[].type includes "TermsOfService"'
        description: >
          Machine-findable terms establishing the legal basis for access —
          the contract a regulator expects to exist and be discoverable.
      - id: reg_privacy_policy
        label: Privacy policy (data handling)
        facet: regulatory
        points: 4
        rule: 'common[].type includes "PrivacyPolicy"'
        description: >
          A published privacy policy stating how personal/consumer data is
          handled — the disclosure most regulated regimes require.
      - id: reg_compliance_published
        label: Compliance / certification disclosure
        facet: regulatory
        points: 5
        rule: 'common[].type includes "Compliance" or "TrustCenter" or "Trust"'
        description: >
          Published compliance, certification, or trust-center content
          (SOC 2, ISO 27001, PCI, regime attestations) — evidence the provider
          holds itself to an external standard, not just its own word.
      - id: reg_standards_conformance
        label: Data-standard conformance
        facet: regulatory
        points: 5
        rule: 'implements a recognized data standard — common[].type includes "Standard"/"Conformance", or a Vocabulary/JSON-LD context is published'
        description: >
          Evidence the API conforms to the industry's data standard (a named
          standard, conformance artifact, or a published vocabulary/JSON-LD
          context). In a regulated space, speaking the mandated shape is the
          difference between interoperable and merely present.

      # ---------------------------------------------------------------------
      # REGIME-SPECIFIC CHECKS (new in 0.6)
      #
      # Everything above is regime-AGNOSTIC — the common posture every regulated
      # regime expects. These award ONLY to providers matched to the named
      # regime, and are N/A (excluded from the denominator) for everyone else,
      # exactly as an absent artifact type is. A payments company is never
      # measured against FHIR, and a hospital is never measured against PCI.
      #
      # Each resolves against the provider's conformance/ artifact, matched to
      # the `standards:` list declared on its regime in industry_regulatory
      # above. That turns the Standards catalog into a scoring input and closes
      # the loop between the papers, the standards and the score.
      # ---------------------------------------------------------------------
      - id: reg_named_standard_conformance
        label: Conforms to the standard named for its regime
        facet: regulatory
        points: 8
        regime: any
        rule: 'conformance/ declares conformance to a standard listed under the matched
               regime`s `standards:` — not merely a generic Standard tag'
        description: >
          The provider conforms to the standard RECOGNIZED FOR ITS REGIME, resolved
          against the standards catalog: OBIE, the DSB Consumer Data Standards, FDX or
          Berlin Group for open banking; US Core / USCDI for health; ACORD, CIECA or
          CSIO for insurance; CAMARA or TM Forum for telecom; Green Button / ESPI or
          cds-energy for energy.

          This supersedes the generic check above in strength for a reason the banking
          quartet made plain: a `Standard` tag credits an intention, while naming the
          instrument credits a fact. It is also the check the insurance quartet needed
          to state its emptiest finding honestly — ACORD is live inside a
          machine-readable contract at exactly one company worldwide.
      - id: reg_fapi_profile
        label: FAPI / hardened authorization profile
        facet: regulatory
        points: 6
        regime: banking_open_finance
        rule: 'conformance declares FAPI or FAPI 2.0, or auth artifacts document PAR,
               private_key_jwt or mTLS-bound tokens'
        description: >
          The security profile CDR, UK Open Banking and PSD2 actually mandate, beyond
          generic OAuth: the FAPI profile, pushed authorization requests, private_key_jwt
          client authentication, mTLS-bound tokens. Generic OAuth is table stakes; this
          is the stack the regime specifies.
      - id: reg_consent_model
        label: Published consent model
        facet: regulatory
        points: 7
        regime: [banking_open_finance, health, insurance, telecommunications, energy_utilities]
        rule: 'a machine-readable consent surface — consent scopes, a FHIR Consent
               resource, a CDR consent artifact, or a documented consent/authorization model'
        description: >
          A consent surface a machine can read. This is the structural gap the whole
          series found and the reason it is weighted where it is: in market after market
          whose entire premise is consumer consent, machine-readable consent ran in the
          single digits. A FHIR Consent resource is exposed by essentially nobody;
          insurance ran at 2.5% in the US and zero among every market's leaders, in the
          most personally-invasive data business in the economy.

          Weighted heaviest in insurance and telecom precisely BECAUSE no rule compels
          it there — where consent is unmandated its presence is a genuine
          differentiator rather than a compliance artifact.
      - id: reg_write_surface
        label: Action / write surface
        facet: regulatory
        points: 4
        regime: [banking_open_finance, payments]
        rule: 'the contract exposes payment initiation, VRP, or another mutating
               regulated operation'
        description: >
          The regime is actionable, not read-only. An agent that can move money on an
          account is a different animal from one that can only read it, and the score
          should say so: the UK — which mandated payment initiation — scored 87% on
          idempotency, where read-only Australia scored 0%.
      - id: reg_smart_configuration
        label: SMART-on-FHIR configuration served
        facet: regulatory
        points: 6
        regime: health
        rule: 'a .well-known/smart-configuration is served, or SMART scopes are published'
        description: >
          A served `.well-known/smart-configuration` with published SMART-on-FHIR
          scopes. The structural finding across all four healthcare markets: the
          security scopes often exist, but the smart-configuration is served almost
          nowhere — so the check has to weight a DISCOVERABLE, consent-legible surface
          rather than the mere presence of scopes somewhere in prose.
      - id: reg_pci_sca
        label: PCI scope and strong customer authentication
        facet: regulatory
        points: 6
        regime: payments
        rule: 'PCI-DSS attestation or scope disclosure, plus 3-D Secure / SCA support'
        description: >
          PCI-DSS attestation or scope disclosure together with strong customer
          authentication (3-D Secure, PSD2 SCA). The two disclosures every payments
          regime is built on, and the ones a merchant's own auditor will ask for first.
      - id: reg_entitlement_terms
        label: Machine-readable entitlement and redistribution terms
        facet: regulatory
        points: 6
        regime: securities_market_data
        rule: 'redistribution / entitlement / data-licensing terms published as
               machine-readable data'
        description: >
          Entitlement and redistribution terms in machine-readable form, plus MiFID II
          or exchange data-licensing disclosure. In market data the licence IS the
          product boundary, and a consumer who cannot read it programmatically cannot
          build against it safely.
      - id: reg_certification_signal
        label: Third-party certification
        facet: regulatory
        points: 5
        regime: [insurance, health, energy_utilities, telecommunications]
        rule: 'a public, independently-issued certification is held and discoverable'
        description: >
          A certification issued and published by somebody other than the provider.
          Canada runs the only public, tiered insurance API certification programme in
          the world (CSIO) and it was invisible to the score — its own table lists the
          country's largest P&C insurer as Not Yet Rated while smaller competitors hold
          higher tiers, which is exactly the published signal a rubric should read.

          THE CAUTION THIS CHECK CARRIES, learned from real estate: RESO certification
          is real, independently tested and industry-mandated, and it is worth 2.0 points
          of measured difference — because all three certified organizations return 401
          on the very contract they are certified against. A certification claim is
          credited here only alongside `servers_resolvable`; a badge for a document the
          consumer cannot fetch is not conformance.
      - id: reg_camara_conformance
        label: CAMARA / network-API conformance
        facet: regulatory
        points: 6
        regime: telecommunications
        rule: 'an x-camara-commonalities version, /camara/ paths, CIBA support, or
               TM Forum Open API conformance'
        description: >
          Conformance to the network-API standards the sector actually built: CAMARA
          commonalities, the canonical API definitions, CIBA (the backchannel
          authentication flow CAMARA specifies for network authorization, found in 3 of
          19 standards repositories and absent from both specs of the one exposure
          platform with a callable endpoint), and TM Forum Open API conformance — held
          widely by carriers who publish no network API at all.
      - id: reg_mandate_verified
        label: Mandate implemented, not merely claimed
        facet: regulatory
        points: 8
        regime: [banking_open_finance, energy_utilities, health]
        rule: 'the mandated surface is evidenced by a resolvable endpoint, register entry
               or conformant discovery document — not by a compliance page'
        description: >
          THE LARGEST UNMEASURED EFFECT IN THE CATALOG, and the reason it lands in 0.6
          rather than waiting. Across 95 energy organizations scored on a deliberately
          ruthless mandate ladder, a VERIFIED mandate was worth about twelve points of
          composite — live-implemented 42.2 against not-applicable 36.6 — while a
          CLAIMED-but-unverifiable mandate scored 30.4, BELOW the 30.2 of organizations
          under no obligation at all.

          That second number is the finding. Self-declared compliance is not merely
          uninformative, it is NEGATIVE signal, and any assessment that reads compliance
          pages instead of calling endpoints will rank the field backwards at the top.
          Compare RESO in real estate at 2.0 points: same question, two sectors, a
          six-fold difference in effect, because one mandate came with a public register
          and conformant discovery endpoints and the other came with a badge.

          The failure mode is already live here: two Ontario utilities present as Green
          Button compliant and cannot be verified, one because its onboarding host
          returns HTTP 200 for every path including invented ones, being a single-page-app
          catch-all. Without a verification state that provider scores as compliant.

# ---------------------------------------------------------------------------
# Output bands — used to label providers in UI / search.
# Composite score (0–100) maps to a band; bands drive sorting tiers and badges.
# ---------------------------------------------------------------------------
# Band cut points are calibrated against the observed catalog distribution, not
# picked round. Re-derive them with signals/band_distribution.rb after any
# material rubric change — a band nobody occupies, or one holding 40% of the
# catalog, tells a provider nothing about where they stand or what to do next.
#
# v0.4 re-cut (2026-07-17), from the 2026-07-15 snapshot of 8,956 providers:
#   - `minimal` held 40.7% of the catalog — a single undifferentiated bucket
#     spanning the whole 0–29 range. A provider doing real work from 6 to 28
#     never saw their label move, which breaks the improvement loop the score
#     exists to drive.
#   - The 0–29 range is not uniform. 1,180 providers spike at 6–8 (the true
#     "index entry and nothing else" floor), 9–14 is a sparse valley (236
#     providers), and 15–29 is a densely populated ramp (2,231). The valley at
#     14/15 is a real feature of the data, so that is where `minimal` now ends
#     and `emerging` begins — the cut follows the distribution rather than a
#     percentile.
#   - `exemplar` was documented as 70–100, but the catalog's observed ceiling is
#     79.2. It is now expressed as an open-ended floor (70+) so the ladder stops
#     advertising 20 points of range that nobody has ever occupied.
#
# v0.6 re-cut (2026-07-28), 25,573 providers, 70/60/45/30/15 -> 66/56/42/28/13.
# THE PRINCIPLE: 0.6 is a correctness release, not a change in ambition. A
# provider that published nothing different should not change band because the
# rubric learned to read authorship. The batch moved the composite down by a
# mean of 1.92 points and a median of 1.80 — provenance grading and the raised
# discoverability bar pushing down, contract-type-agnostic scoring and broadened
# governance pushing up — so the cuts move with it.
#
# Held against the 0.5.1 shares, the re-cut preserves what each rung MEANS:
#
#     band          0.5.1     0.6 at 66/56/42/28/13
#     exemplar       1.1%      1.0%
#     strong         3.8%      4.1%
#     developing    13.4%     13.7%
#     thin          15.0%     15.0%
#     emerging      22.5%     23.5%
#     minimal       44.2%     42.6%
#
# 2,239 providers change band — 8.8%, against 13.8% if the old cuts were left in
# place. Every one of those moved because its evidence changed: GraphQL-native
# providers rising as the contract facet learned to read them (grafast, pothos,
# envelop, graphql-code-generator, agility-cms all +10.7), telecom rising into a
# regime that did not exist (totogi +15.0), and providers resting on derived
# artifacts falling.
#
# `minimal` at 42.6% still holds more of the catalog than any band should. That
# is a CATALOG COMPOSITION fact, not a calibration miss: 4,999 providers sit in a
# single 2-point bucket at 4–6, the true "index entry and nothing else" floor of
# a 25,573-provider catalog that grew from 8,956. Splitting it needs a signal
# that distinguishes those providers from each other, which no facet currently
# has. Queued, not fudged.
bands:
  - id: exemplar
    label: Exemplar
    min: 66
    range: 66+
    share: 1.3%
    description: >
      Reference-quality API operations across every facet — a rich contract, published
      governance, transparent operations, and machine-readable commercial terms. The
      top ~1% of the catalog, and the band no provider reaches by accident.
  - id: strong
    label: Strong
    min: 56
    range: 56 – 65.9
    share: 4.4%
    description: >
      Solid contracts, transparent operations, and an easy start. Typically complete on
      four or five facets with one clear soft spot — most often governance or a missing
      commercial artifact.
  - id: developing
    label: Developing
    min: 42
    range: 42 – 55.9
    share: 13.8%
    description: >
      Real signal across most facets with visible, nameable gaps. The contract exists
      but is thin on descriptions or examples, or the portal is good while governance
      and commercial terms are absent.
  - id: thin
    label: Thin
    min: 28
    range: 28 – 41.9
    share: 14.4%
    description: >
      Limited machine-readable signal and partial portal coverage. Usually a provider
      with documentation a human can read but little a machine or agent can consume
      without scraping.
  - id: emerging
    label: Emerging
    min: 13
    range: 13 – 27.9
    share: 23.4%
    description: >
      More than an index entry, but the surface is still mostly links rather than
      artifacts. These providers have started publishing — a portal, a few common
      links, maybe a spec — and are the cohort most likely to move a full band from
      modest, well-targeted work.
  - id: minimal
    label: Minimal
    min: 0
    range: 0 – 12.9
    share: 42.7%
    description: >
      Index entry only; little beyond a description and a link. Nothing here is
      machine-readable enough for an agent to act on without a human first reading
      the site.

# ---------------------------------------------------------------------------
# Trending — applied on top of the absolute score using week-over-week deltas.
# Stored as a sibling label so search can boost improving APIs.
# ---------------------------------------------------------------------------
trending:
  rising_threshold: 5
  falling_threshold: -5
  history_window_weeks: 12

# ===========================================================================
# Agent Readiness — a STANDALONE score, deliberately NOT blended into the
# composite above. The composite measures how complete and consumable an API
# surface is for a human developer; this measures how safely an autonomous AI
# AGENT can drive it. They are correlated but not the same, so they are scored
# and displayed side by side rather than merged.
#
# Model adapted from api-evangelist/agent-readiness (the nine-dimension model,
# scored 0–3 there). Here each dimension is a provider-level presence check
# awarding points; the earned total is normalized to 0–100 and mapped to a
# band. Sourced entirely from signals already in the catalog — the x-agentic-
# access contract, MCP servers, Agent Skills, error/idempotency/rate-limit
# common links, well-known catalogs — so it re-runs on every scoring pass with
# no deep-spec parsing.
#
# Unlike the composite, a missing spec here is a REAL deficiency, not N/A: an
# API with no machine-readable contract cannot be driven by an agent at all,
# so every dimension is always in the denominator.
# ===========================================================================
agent_readiness:
  schema_version: 0.2
  standalone: true          # not part of the composite; own score + own band
  label: Agent Readiness
  description: >
    How safely an autonomous AI agent — not just a human developer — can drive
    this API. Measures machine-readable contracts, agent-native access controls,
    and the operational signals (idempotency, stable errors, rate-limit state)
    an agent needs to act without a human papering over the gaps.
  dimensions:
    - id: spec_presence
      label: Machine-Readable Contract
      points: 18
      signal: 'api_specs includes an OpenAPI document'
      description: >
        A public OpenAPI contract exists. Agents call APIs from contracts, not
        HTML docs — with no spec there is no programmatic surface to drive, which
        is why this is the single largest award.
    # REWEIGHTED 15 -> 10 AND PROVENANCE-GRADED IN 0.6. Not a judgment that the
    # x-agentic-access contract matters less — it is the most explicit agent-design
    # signal in the catalog and has no equivalent anywhere in the field. It is a
    # judgment that this dimension was measuring API Evangelist. Of the 6,388
    # providers carrying an agentic-access artifact, 6,383 are `method: generated`
    # — 99.9%. At 15 points every one of them earned the second-largest award in the
    # model for work this pipeline did on their behalf, and a dimension nearly
    # everyone earns identically is not discriminating between anyone.
    - id: agentic_access
      label: Agentic Access Contract
      points: 10
      provenance: agentic_access
      signal: 'agentic_access artifact present (x-agentic-access), graded by author'
      description: >
        The provider publishes an x-agentic-access contract classifying each
        operation by action-class, consequence, and human-in-the-loop escalation.
        The most explicit "this API was designed to be driven by an agent" signal
        in the catalog — when the provider publishes it. A derived classification
        keeps a floor: it is a real artifact an agent can fetch and act on, it is
        simply not evidence about the provider's design intent.
    - id: mcp_server
      label: MCP Server
      points: 12
      provenance: mcp
      signal: 'common[].type includes MCPServer, graded by whether the provider runs it'
      description: >
        A Model Context Protocol server makes the API directly callable by agents
        over a uniform tool surface — the most direct expression of agent-first
        design.

        PROVENANCE-GRADED IN 0.6. Across four national banking markets exactly one
        institution ran a genuinely hosted MCP; in UK insurance the data credited
        14.3% of the cohort and the real number was zero. Catalog-wide, 1,882 of
        3,046 MCP artifacts are derived candidates with no URL. Twelve points is
        the third-largest award in this model and it was being paid, more often
        than not, for a server nobody can connect to.
    - id: auth_clarity
      label: Machine-Readable Auth
      points: 10
      signal: 'common[].type includes Authentication, OpenIDConnect, OAuthScopes, or API Keys'
      description: >
        The authentication model is documented in a form an agent can negotiate
        without reading prose — OIDC discovery, declared scopes, or OpenAPI
        security schemes.
    # ---------------------------------------------------------------------
    # THE THREE SPEC-VERIFIED DIMENSIONS (graded in 0.6)
    #
    # These were link-based proxies: a provider earned the full award for
    # publishing a documentation page titled "Idempotent Requests". That is the
    # one criticism of this rubric a reviewer will find first, it is fair, and
    # a published competitor (Jentic's JAIRF, Apache-2.0, December 2025) ships
    # this class of check today.
    #
    # 0.6 does NOT replace the proxies — replacing them would zero every
    # provider with a documented behaviour and no published spec, which is a
    # different error. Each becomes GRADED instead:
    #
    #   verified   the behaviour is present in the contract itself   1.00
    #   documented only a provider-level link asserts it             0.50
    #
    # A provider who proves it in the spec now outscores one who claims it in
    # prose, and one who does neither still scores zero.
    # ---------------------------------------------------------------------
    - id: idempotency
      label: Idempotency
      points: 9
      graded: true
      credit: {verified: 1.0, documented: 0.5}
      signal: 'OpenAPI mutating operations declare an Idempotency-Key header (verified),
               else common[].type matches /idempoten/i (documented)'
      description: >
        Mutating operations accept an idempotency key. Agents retry; without
        idempotency a retry double-charges a card, sends a message twice, or opens
        a duplicate ticket. Full credit requires the parameter to appear on POST /
        PATCH / PUT operations in the contract — the difference between a provider
        saying they support it and a contract an agent can act on.
    - id: error_semantics
      label: Stable Error Semantics
      points: 8
      graded: true
      credit: {verified: 1.0, documented: 0.5}
      signal: 'OpenAPI $refs a shared error schema across 4xx/5xx responses (verified),
               else common[].type includes ErrorCatalog / ErrorCodes / DeclineCodes'
      description: >
        Errors are a documented, stable envelope with stable codes. Agents branch
        on errors — free-text messages break that branching and send an agent into
        blind retries. Full credit requires a single error schema referenced across
        error responses: a typed envelope, not a catalogue of codes in a table.
    - id: openapi_examples
      label: Request/Response Examples
      points: 7
      graded: true
      credit: {verified: 1.0, partial: 0.5, documented: 0.25}
      signal: 'share of operations carrying request/response examples; else an
               Examples / Code Samples link'
      description: >
        Meaningful examples are published. Examples are the cheapest way an agent
        learns a payload shape before it ever makes a call. Graded in 0.6 because as
        a bit it ran at roughly 0% across payments and healthcare and discriminated
        between nobody: full credit at 50%+ of operations carrying an example, half
        below that, a quarter for a documentation link alone.
    - id: rate_limit_signal
      label: Rate-Limit Signaling
      points: 7
      graded: true
      credit: {verified: 1.0, documented: 0.5}
      signal: 'OpenAPI responses document X-RateLimit-* / RateLimit headers (verified),
               else a rate_limits artifact or RateLimits link (documented)'
      description: >
        Rate-limit behaviour is documented as machine-readable data. An agent needs
        to know when to back off; "you will get a 429 eventually" is not something
        it can plan against. Full credit requires the API to surface live rate-limit
        state in RESPONSE HEADERS, which is what an agent reads mid-run — documented
        limits tell it the ceiling, headers tell it where it is.
    - id: asyncapi_events
      label: Typed Event Surface
      points: 6
      signal: 'api_specs includes AsyncAPI, or common[].type includes Webhooks'
      description: >
        Event and webhook surfaces are described by a contract, so an agent that
        must react to state changes has a typed surface rather than example payloads.
    - id: agent_skills
      label: Agent Skills
      points: 5
      provenance: skills
      signal: 'skills artifact present, graded by who authored it'
      description: >
        Packaged operating instructions an agent should follow when using the API,
        rather than leaving usage to be inferred from the spec. PROVENANCE-GRADED
        IN 0.6: 2,018 of 2,274 skill sets in the catalog are API-Evangelist-generated.
        In UK insurance all 27 were; across all of telecom, provider-published agent
        skills exist at exactly three companies.
    - id: well_known_catalog
      label: Well-Known Catalog
      points: 4
      signal: 'common[].type includes WellKnown, APICatalog, or api-catalog'
      description: >
        A /.well-known/api-catalog (RFC 9727) linkset — the canonical machine
        entrypoint an agent hits first to discover the provider's APIs and MCP
        endpoints.
    - id: consent_identity
      label: Consent & Bot Identity
      points: 3
      signal: 'common[].type includes AIPREF, ContentSignal, WebBotAuth, HTTPMessageSignatures, or SecurityTxt'
      description: >
        Forward-looking signals for machine-readable AI usage preferences (AIPREF,
        Content-Signals) and cryptographically identified agent traffic (Web Bot
        Auth / RFC 9421). Rare today; rewards the providers defining the frontier.
    # GRADED, not binary — the only dimension scored on a scale rather than a bit.
    # A survey of 22,341 catalog hosts (2026-07-28) found 65 providers serving an
    # agent card and only 10 of them conformant: `capabilities` shipped as an array
    # where A2A defines an object, `supportedInterfaces` where the spec says
    # `additionalInterfaces`, no `protocolVersion` at all. A boolean would record 65
    # adopters of a specification 41 of them are not following.
    - id: agent_card
      label: A2A Agent Card
      points: 8
      graded: true
      signal: 'a2a/<slug>-a2a.yml manifest, graded on conformance.grade against A2A 1.0.0'
      credit:
        conformant: 1.0        # passes every structural check
        near-conformant: 0.6   # correctly shaped, omits optional fields
        flavored: 0.25         # agent card in spirit, fails a hard check
        invalid: 0.0
      description: >
        The provider serves a machine-readable agent discovery manifest at the A2A
        well-known path (/.well-known/agent-card.json, RFC 8615), advertising its
        identity, capabilities, skills, endpoint and auth. Weighted above agent_skills
        despite low adoption for a structural reason: an agent card is the only agent
        surface in this rubric that CANNOT be derived on a provider's behalf — it is
        served from the provider's own host or it does not exist. Where mcp_server,
        agent_skills and agentic_access can all credit an artifact API Evangelist
        authored, this one is provider-published by construction, and so is immune to
        the provenance defect that distorts the others.
    # NEW IN 0.6 — the fourth planned dimension, and the only one with no
    # provider-level proxy to supersede. It has to be read from the contract or not
    # at all, which is why it waited for spec parsing.
    - id: dry_run_mode
      label: Dry-Run / Simulate Mode
      points: 4
      signal: 'OpenAPI: destructive operations expose a dry_run / simulate / preview /
               validate_only parameter'
      description: >
        A destructive operation can be planned before it is committed. This is the
        safest agent-native affordance in existence and the rarest: it lets an agent
        show a human what it is about to do, or check its own work, without doing it.
        Every other safety rail in this model limits the damage of an action that has
        already happened; this one is the only dimension that prevents it.
  # Cut points calibrated against the real distribution (re-cut 2026-07-28,
  # 25,573 providers) — re-derive with band_distribution.rb after any change to
  # dimensions or points. The spread is deliberately bimodal: a large floor at
  # 0–9 (no agent signal) and a large plateau — the ~3,300 providers the
  # enrichment pipeline gave the same baseline (a spec, a generated agentic-
  # access contract, documented auth, rate limits) and nothing more. No cut can
  # split an identical-score plateau, so agent-ready is intentionally broad: it
  # is the baseline cohort, and the differentiators (MCP, idempotency, stable
  # errors, examples) are what lift a provider out of it into agent-native.
  #
  # WHY THE CUTS MOVED IN 0.5.1 (60/45/15 -> 56/42/14). Agent Readiness is
  # earned/max, so adding agent_card raised max from 104 to 112 and rescaled every
  # provider's score by 104/112 — an arithmetic change, not a measurement one.
  # Left alone it would have pushed the baseline plateau from 48 to 44.6, just
  # under the old 45 cut, and DEMOTED 3,726 providers (14.6% of the catalog) for
  # publishing nothing different. The cuts are re-derived at the same valleys in
  # the rescaled distribution: 56 sits in the 57–59 trough, 42 just below the
  # plateau now at 44, 14 at the old 15 boundary. Result: 15 providers change
  # band, all UPWARD, and every one of them earned it with a published agent card.
  #
  # WHY THEY MOVED AGAIN IN 0.6 (56/42/14 -> 46/34/6). This time the cause is a
  # measurement change, not arithmetic, and it is the largest correction in the
  # rubric's history. Provenance grading cut the credit for derived MCP servers,
  # agent skills and agentic-access contracts to a quarter, which collapsed the
  # enrichment baseline plateau — the ~3,300 providers who all scored ~44 on a
  # spec, a GENERATED agentic-access contract, documented auth and rate limits.
  # That plateau now sits at 30–32 and holds 2,084 providers.
  #
  # Every cut is placed at a real feature of the re-scored distribution:
  #
  #   6   the valley immediately above the floor. 15,651 providers sit at 0–4
  #       with no agent signal at all; the 4–6 bucket holds 58.
  #   34  the valley ABOVE the baseline plateau (34–36 holds 244, against 2,084
  #       at 30–32). This is the correction stated as a cut point: a provider
  #       whose only agent artifacts were written for it is agent-AWARE, not
  #       agent-ready, and the old 42 cut sat on the wrong side of that plateau.
  #   46  the shoulder of a >50% drop (44–46 holds 487, 46–48 holds 232).
  #
  # Resulting shares: agent-native 1.2%, agent-ready 14.3%, agent-aware 23.1%,
  # human-only 61.4%. Agent-native falls from 6.1% to 1.2% and that IS the
  # finding — most of the old cohort was agent-native on artifacts API Evangelist
  # wrote. Of the 1,210 providers scoring above 46, the band gate below demotes
  # 895 for having no idempotency and no stable error envelope.
  # ---------------------------------------------------------------------------
  # BAND GATE (new in 0.6) — no dimension compensates for a missing safety rail.
  #
  # Agent Readiness is additive, so strengths cover for absences. The four largest
  # awards plus examples — spec_presence 18, agentic_access, mcp_server 12,
  # auth_clarity 10, openapi_examples 7 — clear the Agent-Native floor with
  # idempotency, error_semantics and rate_limit_signal ALL AT ZERO. That is
  # precisely the provider whose agent retries a payment twice, branches on
  # free-text errors, and backs off only after a 429. Calling it Agent-Native is
  # the single worst false positive this model can produce.
  #
  # Jentic's JAIRF makes that configuration impossible with a weighted harmonic
  # mean. Adopting one here would destabilise every score in the catalog and force
  # a recalibration for a problem that lives in one band. The proportionate fix is
  # a gate: cheap, mechanically simple, defensible in a sentence, and it touches no
  # arithmetic below the top band. Same family as JAIRF's structural gates
  # (FC < 40 caps at Level 0) — a score that adds up without ever refusing to award
  # is a score that can be farmed.
  #
  # A provider that meets the gate on the DOCUMENTED half-credit still passes: the
  # gate asks whether the rail exists at all, not how well it is evidenced.
  band_gate:
    agent-native:
      requires_all: [idempotency, error_semantics]
      demote_to: agent-ready
      rationale: >
        An agent driving a surface with no idempotency and no stable error envelope
        is not being driven safely, however much else the provider publishes.

  bands:
    - id: agent-native
      label: Agent-Native
      min: 46
      share: 1.1%
      description: >
        Built to be driven by agents, and the provider built it — a contract, a
        real agent surface the provider itself publishes, and the safety rails
        the band gate now requires: idempotency AND a stable error envelope. The
        providers an agent can drive safely today, as opposed to the providers
        somebody has written agent artifacts about.
    - id: agent-ready
      label: Agent-Ready
      min: 34
      share: 13.2%
      description: >
        An agent can drive the core surface. A machine-readable contract and
        documented auth are in place, and there is real agent-facing work beyond
        the baseline; the safety rails (idempotency, stable errors, rate-limit
        signalling) mostly are not.

        NARROWED IN 0.6. This band used to hold the enrichment baseline plateau —
        ~3,300 providers whose agentic-access contract was generated for them.
        Once that credit was graded down the plateau fell to 30–32 and the cut
        moved above it, so this band now means an agent surface the provider had
        a hand in rather than one the catalog supplied.
    - id: agent-aware
      label: Agent-Aware
      min: 6
      share: 24.3%
      description: >
        Partial machine-readable surface. An agent can read some of the API but
        would hit implicit conventions a human silently absorbs — the gaps where it
        retries blindly or gets stuck.
    - id: human-only
      label: Human-Only
      min: 0
      share: 61.4%
      description: >
        Little an agent can consume without a human first reading the site. A
        developer can integrate it; their agent cannot yet.

  # All four dimensions planned at 0.5.1 SHIPPED IN 0.6. Three landed as graded
  # upgrades to the link-based proxies they were specified to supersede
  # (idempotency, rate_limit_signal, error_semantics) rather than as replacements,
  # so a provider with a documented behaviour and no published spec keeps half
  # credit instead of dropping to zero. `dry_run_mode` landed as a new dimension,
  # since no provider-level proxy for it exists.
  #
  # What is queued next, and why each is waiting:
  planned_dimensions:
    - id: agentic_commerce
      label: Agentic Commerce Protocols
      signal: 'UCP / ACP / AP2 / x402 support declared or implemented'
      blocked_on: collection
      description: >
        Elogic weights protocol support — UCP, ACP, AP2, MCP — at 25% of its
        commerce index, and Cloudflare tracks x402 and UCP as a fifth layer. This
        rubric reads none of them. For a catalog whose thesis is that agents will
        transact, that is a visible hole, and it is arriving fastest in exactly the
        commerce-adjacent providers this catalog is thickest in. Waiting on a
        first-party probe of the kind that produced `agent_card`, not on rubric work.
    - id: pagination_ratio
      label: Pagination Coverage
      signal: 'share of collection-returning GET operations declaring pagination'
      blocked_on: parser
      description: >
        JAIRF scores pagination as a RATIO of paginated GET resources and this model
        does not read it at all. Computable from the refined per-tag OpenAPIs the
        catalog already carries; it needs a resource-classifier to know which GETs
        return collections, which is the only reason it is not in 0.6.
    - id: operation_distinctiveness
      label: Operation Distinctiveness
      signal: 'embedding distance between operation summaries within a spec'
      blocked_on: parser
      description: >
        Whether an agent can tell two operations apart from their descriptions.
        JAIRF computes it with embeddings; nothing equivalent exists here. The most
        directly agent-relevant check in a competitor's spec that this rubric lacks.
