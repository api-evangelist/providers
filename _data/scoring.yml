# Mirrored from api-search/signals/_data/scoring.yml by build-sections.py — do not edit here.
# Kin Score — Scoring Rubric (the API Evangelist rating system, licensed by APIs.io)
#
# Per-artifact checks produce raw points. Points roll up into facet sub-scores
# (each normalized to 0–100). Facet sub-scores roll up into a composite
# provider score using the facet weights below.
#
# All weights and point values are tunable. Keep this file the single source
# of truth for the rubric — code that scores providers should read from here.

schema_version: 0.7
last_updated: '2026-07-31'
maintainer: kin@apievangelist.com

# ---------------------------------------------------------------------------
# CHANGELOG
#   0.6 (2026-07-28) — THE PROVENANCE RELEASE. The largest correctness batch in
#       the rubric's history, landing the queue that eight sector quartets
#       accumulated. Five groups of change:
#
#       (1) PROVENANCE GRADING (the blocking fix). Through 0.5.1 the rubric
#           credited the PRESENCE of an artifact and could not see WHO WROTE IT.
#           The enrichment pipeline authors artifacts on a provider's behalf and
#           stamps them `method: derived|generated` / `status: candidate`, and
#           the score read none of it. Measured across the catalog on 2026-07-28:
#           99.9% of agentic-access contracts (6,383 of 6,388), 88.7% of agent
#           skills (2,018 of 2,274) and 61.8% of MCP servers (1,882 of 3,046)
#           are API Evangelist's own work scoring as the provider's. 0.6 grades
#           three authorship states — first-party, conformance, derived — via the
#           `provenance:` block below, sourced from signals/_data/provenance.json.
#       (2) A CONTRACT YOU CANNOT CALL. `servers[].url` is now parsed and graded:
#           a resolvable production host outscores a placeholder (example.com) or
#           a bare template (`{apiRoot}`). 834 providers hold no spec with a
#           resolvable host; 10,950 of 87,612 specs are uncallable as published.
#       (3) CONTRACT-TYPE-AGNOSTIC SCORING. contract_quality was OpenAPI-only, so
#           GraphQL-native and FHIR-native providers read as having no contract.
#           A GraphQL SDL and a FHIR CapabilityStatement now satisfy the contract
#           requirement and are graded on their own richness.
#       (4) SPEC-VERIFIED AGENT READINESS. The three link-based proxies
#           (idempotency, rate_limit_signal, error_semantics) become GRADED: full
#           credit when the behaviour is verified in the contract, half when only
#           a documentation link asserts it. Adds `dry_run_mode`. This closes the
#           one fair criticism a published competitor (Jentic JAIRF) can make.
#       (5) BAND GATE + REGIME FIXES. No provider reaches Agent-Native without
#           idempotency AND error semantics — additive scoring let 62 of 112
#           points buy the top band with every safety rail at zero. The
#           `broker` tag collision that scored insurance brokers against MiFID is
#           fixed by most-specific regime matching; telecommunications and
#           energy_utilities regimes added; regime-specific checks land.
#
#       Both band sets are re-cut against the re-scored distribution — mandatory,
#       not cosmetic, because points and denominators both moved.
#   0.5.1 (2026-07-28) — Added the agent_card dimension (8 pts) to the standalone
#       Agent Readiness score, and RE-CUT its bands to 56/42/14. Additive: the
#       composite and every base facet are untouched. agent_card is the first
#       GRADED dimension — conformant 1.0 / near-conformant 0.6 / flavored 0.25
#       against A2A 1.0.0 — because a survey of 22,341 catalog hosts found 65
#       providers serving an agent card and only 10 conformant, so a bit would
#       have reported 65 adopters of a spec 41 of them do not follow. The band
#       re-cut is mandatory, not cosmetic: agent readiness is earned/max, so a new
#       dimension raises max 104 -> 112 and rescales every score by 104/112. At the
#       old cuts that would have demoted 3,726 providers for publishing nothing
#       different. Re-cut at the same valleys, 15 providers move — all upward, all
#       because they publish an agent card.
#   0.5 (2026-07-23) — Added a CONDITIONAL regulatory facet (weight 0.15) that
#       applies only to providers in regulated industries, matched by tags via
#       the industry_regulatory map below. When it applies, the six base facets
#       (which sum to 1.0) are scaled to the remaining 0.85 and regulatory takes
#       a fixed 0.15 slice; when it does not apply, the composite is the base
#       six-facet score, unchanged from 0.4. Motivated by the sector reports:
#       in a regulated space (open banking, market data, health) the consent,
#       security, and compliance posture a regime demands is core to readiness,
#       and an API that ignores it should score lower — but a weather or maps
#       API should never be judged against a regime that does not apply to it.
#   0.4 — Six-facet composite + standalone Agent Readiness.
# ---------------------------------------------------------------------------

