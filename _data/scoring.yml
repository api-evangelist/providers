# ---------------------------------------------------------------------------
# thresholds (schema 0.10.0+) — WHICH CHECKS ARE COUNTS, NOT BITS.
#
# These checks pass on a COUNT crossing a bar, not on the presence of one thing.
# Nothing in the rubric said so, so every consumer of `--explain` treated them
# as "close the evidence gap and earn the points". For a count check that is
# false: a probe finds an SDK page, wiring one `SDKs` pointer earns
# `sdk_count_1` and leaves `sdk_count_3` exactly where it was.
#
# Measured on the API management cohort: three providers had a verified SDK page
# and the naive remediation math credited both checks — 12.2 composite points
# across the cohort that no amount of wiring can deliver.
#
# This matters most in the Personalized Checklist, where the points column IS
# the pitch. A checklist that promises points a provider cannot earn by doing
# what it says is worse than one that under-promises. roadmap#30.
# ---------------------------------------------------------------------------
thresholds:
  multiple_apis: 3
  tags_present: 5
  description_substantive: 200        # characters, not items
  sdk_count_1: 1
  sdk_count_3: 3
  rules_present: 1
  rules_substantial: 20
  plans_present: 1
  plans_multiple: 3
  rate_limits_documented: 1
  rate_limits_rich: 3
  json_schema_per_resource: 2
  json_ld_class_depth: 5
  json_ld_property_depth: 10
  graphql_type_depth: 20
