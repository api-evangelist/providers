# ---------------------------------------------------------------------------
# attribution (schema 0.9.4+) — WHO CAN MOVE THIS CHECK.
#
# The provenance block above answers "who wrote the artifact we are reading".
# This block answers a different question, and a Market Report cannot be
# written honestly without it: if a provider does NOT earn this check, whose
# work closes the gap?
#
# The Kin Score measures a provider AS IT EXISTS IN THE API EVANGELIST INDEX,
# and API Evangelist is a party to that index. That is deliberate (see the
# provenance notes above) — but it means an unearned check has two possible
# authors, and a report that assigns every unearned check to the vendor is
# reporting our own collection backlog as a market finding.
#
# Measured on the API Management cohort (36 providers, 2026-08-11): the
# correlation between the number of pointers WE recorded in a provider's
# apis.yml and its composite score is r = 0.77. The bottom pointer-quartile
# averages 37.7 and the top averages 71.8. Some of that is real — a better
# provider has more to point at — but it is not all real, and the rubric could
# not tell the difference because nothing in it recorded which side of the
# index a check reads from.
#
#   catalog   API Evangelist can satisfy it alone.        -> our backlog
#   index     their surface, our apis.yml pointer.        -> PROBE, then assign
#   harvest   their contract, our tree.                   -> our harvest queue
#   spec      quality inside a contract we already hold.  -> theirs, mostly
#   frontier  only the provider can produce it.           -> theirs, entirely
#
# The `index` class is the one that matters editorially. An index-class zero is
# NOT a finding until a live probe says the provider does not publish it. The
# first cohort probed this way turned "llms.txt: 2 of 36" into "21 of 36 serve
# a real llms.txt; the rubric was reading a type alias it did not have".
#
# Only `frontier` and `spec` zeros are safe to report as market findings
# without a probe. That is the operating rule this block exists to enforce.
# ---------------------------------------------------------------------------
attribution:
  # CATALOG — API Evangelist can satisfy this alone. No provider action is
  # required, and an unearned check here is our backlog, not their gap.
  apis_yml_present: catalog
  balanced_severities: catalog
  base_url_per_api: catalog
  created_modified_dates: catalog
  description_substantive: catalog
  finops_mapped: catalog
  human_url_per_api: catalog
  image_present: catalog
  json_ld_class_depth: catalog
  json_ld_present: catalog
  json_ld_property_depth: catalog
  json_schema_per_resource: catalog
  json_schema_present: catalog
  maintainer_present: catalog
  multiple_apis: catalog
  overlay_published: catalog
  plans_multiple: catalog
  plans_present: catalog
  rate_limits_documented: catalog
  rate_limits_rich: catalog
  rules_present: catalog
  rules_substantial: catalog
  tags_present: catalog
  vocabulary_published: catalog

  # INDEX — the evidence lives on the provider's public surface and the score
  # reads OUR apis.yml pointer. Unearned means EITHER we never indexed it OR
  # they never published it, and the two are indistinguishable without a probe.
  # Never report an index-class zero as a market finding until it is probed.
  agent_skill_present: index
  api_reference_present: index
  auth_clarity: index
  authentication_documented: index
  blog_present: index
  change_log_present: index
  cli_present: index
  compliance_published: index
  console_or_sandbox: index
  deprecation_policy: index
  documentation_present: index
  getting_started_present: index
  github_org_present: index
  mcp_server_present: index
  portal_present: index
  postman_present: index
  pricing_link: index
  privacy_policy: index
  reg_authentication_documented: index
  reg_compliance_published: index
  reg_consent_model: index
  reg_entitlement_terms: index
  reg_oauth_scopes: index
  reg_privacy_policy: index
  reg_security_disclosure: index
  reg_standards_conformance: index
  reg_terms_of_service: index
  reg_vulnerability_disclosure: index
  roadmap_present: index
  sdk_count_1: index
  sdk_count_3: index
  security_disclosure: index
  sign_up_present: index
  status_page_present: index
  support_channel: index
  terms_of_service: index
  trust_center: index
  webhooks_advertised: index

  # HARVEST — a provider-published machine-readable contract, read from the
  # copy we hold. Unearned means we never harvested it, or we hold the wrong one.
  #
  # 0.11 EXCEPTION — the four os_* checks are `harvest`, but their zeros ARE
  # reportable as market findings without a further probe, unlike every other
  # harvest check. The rule exists because a harvest zero normally cannot
  # distinguish "they never published it" from "we never fetched it". For these
  # the harvest IS the live probe: a direct read of the GitHub API across the
  # full set in one pass. And the read-success gate means a repository we could
  # not reach drops out of the facet entirely rather than scoring zero — so a
  # zero here can only mean we looked and it was not there.
  os_security_policy: harvest
